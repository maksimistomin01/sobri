ность выключать блоки для отдельных элементов витрины (например, для определенных товаров, категорий, и т.п.). Также можно включить блок только на одной определенной странице, при этом выключив его на всех остальных страницах такого же типа."},{"type":"p","text":"Чтобы включить/выключить блок на странице определенного элемента:"},{"type":"step","marker":"1","level":0,"text":"В панели администратора откройте страницу редактирования элемента."},{"type":"step","marker":"2","level":0,"text":"Переключитесь на вкладку Макеты"},{"type":"step","marker":"3","level":0,"text":"Включите или выключите нужный блок."},{"type":"images","files":["blocks-edit-04.png"]},{"type":"h2","text":"Настройка блоков"},{"type":"step","marker":"1","level":0,"text":"Доступные блоки для мобильного приложения:"},{"type":"step","marker":"1.1","level":1,"text":"Товарный блок.."},{"type":"p","text":"Шаблоны:"},{"type":"step","marker":"1.1.1","level":2,"text":"Товары"},{"type":"step","marker":"1.1.2","level":2,"text":"Мелкие элементы"},{"type":"step","marker":"1.1.3","level":2,"text":"Скроллер"},{"type":"images","files":["blocks-edit-05.png"]},{"type":"step","marker":"1.2","level":1,"text":"Блок баннеры:"},{"type":"p","text":"Шаблоны:"},{"type":"step","marker":"1.2.1","level":2,"text":"Обычный"},{"type":"step","marker":"1.2.2","level":2,"text":"Карусель"},{"type":"step","marker":"1.2.3","level":2,"text":"Расширенный баннер (карусель)"},{"type":"images","files":["blocks-edit-06.png"]},{"type":"step","marker":"1.3","level":1,"text":"Отзывы"},{"type":"p","text":"Шаблоны:"},{"type":"step","marker":"1.3.1","level":2,"text":"Отзывы"},{"type":"step","marker":"1.4","level":1,"text":"Бренды"},{"type":"p","text":"Шаблоны:"},{"type":"step","marker":"1.4.1","level":2,"text":"Бренды"},{"type":"step","marker":"2","level":0,"text":"В настройки товарных блоков добавлена настройки"},{"type":"step","marker":"2.1","level":1,"text":"Ссылка показать все. Если указать ссылку, то в блоке в мобильном приложении будет показана кнопка которая будет вести на указанную страницу. Для корректной навигации по приложению ссылки должны быть в строгом формате."},{"type":"h2","text":"Форматы ссылок поддерживаемых ссылок:"},{"type":"step","marker":"1","level":0,"text":"Страница. Если вы хотите чтобы ссылка вела на детальную страницу вид ссылки должен быть: dispatch=categories.view&variant_id=[ид_страницы]"},{"type":"step","marker":"2","level":0,"text":"Страница товара. Если вы хотите чтобы ссылка вела на детальную страницу товара вид ссылки должен быть: dispatch=products.view&product_id=[ид_товара]"},{"type":"step","marker":"3","level":0,"text":"Страница категории. Если вы хотите чтобы ссылка вела на категорию товаров вид ссылки должен быть: dispatch=categories.view&category_id=[ид_категории].\nТак же вы можете добавить дополнительные параметры. (Параметры можно комбинировать)"},{"type":"step","marker":"2.1","level":1,"text":"features_hash, в таком случае ссылка будет вести на страницу категории с примененными фильтрами. Пример ссылки: dispatch=categories.view&category_id=223&features_hash=10-87. В данном случае в приложении при нажатии на ссылку произойдет маршрутизация на страницу Категории с id = 223 и примененным фильтром c id = 10 и выбранным вариантом 87. Параметр features_hash вы можете найти в url на странице категорий на сайте, применив нужные фильтры."},{"type":"step","marker":"2.2","level":1,"text":"variant_id, в таком случае ссылка будет вести на страницу категории с товарами выбранного бренда. В данном случае параметр category_id может быть пустым. Пример ссылки dispatch=categories.view&variant_id=86. В данном случае в приложении при нажатии на ссылку произойдет маршрутизация на страницу Категории с товарами варианта бренда = 86 (Adidas)"},{"type":"step","marker":"2.3","level":1,"text":"tag, в таком случае ссылка будет вести на страницу категории с товарами, которые отмечены тегом. Пример ссылки: dispatch=categories.view&tag=Мужские. Будут показаны товары которые отмечены тегом Мужские"},{"type":"step","marker":"4","level":0,"text":"Страница бренда. Если вы хотите чтобы ссылка вела на детальную страницу бренда вид ссылки должен быть: dispatch=brands.view&variant_id=[ид_варианта_характеристики_бренд]"},{"type":"p","text":"пример - dispatch=categories.view&variant_id=86"}]},{"id":"blocks-product","title":"Блок товаров в карточке товара","blocks":[{"type":"p","text":"На страницу товара блоки с товарами добавляются глобально для всех товаров через страницу настройки макетов. После, эти блоки настраиваются индивидуально в карточке товара."},{"type":"h2","text":"Шаг 1. Создаем блок"},{"type":"step","marker":"1","level":0,"text":"В панели администратора откройте страницу Веб-сайт → Темы → Редактировать макеты"},{"type":"images","files":["blocks-product-01.png"]},{"type":"step","marker":"2","level":0,"text":"В открывшемся странице изменить макет на Мобильное приложение и нажмите Задать конфигурацию."},{"type":"images","files":["blocks-product-02.png"]},{"type":"step","marker":"3","level":0,"text":"Для редактирования существующего блока нажмите на шестеренки. В открывшемся окне укажите:"},{"type":"bullet","level":0,"text":"Название"},{"type":"bullet","level":0,"text":"выберите шаблон (для мобильного приложения работает всего три шаблона, скроллер, мелкие элементы, АВ: Сетка (С кнопкой “Показать еще”)."},{"type":"step","marker":"4","level":0,"text":"Переключитесь на вкладку Контент и в поле Заполнение выберите Вручную."},{"type":"images","files":["blocks-product-03.png"]},{"type":"step","marker":"5","level":0,"text":"Для добавления нового блока нажмите кнопку + на контейнере, в котором должен располагаться новый блок, и выберите Добавить блок."},{"type":"step","marker":"6","level":0,"text":"Переключитесь на вкладку Создать новый блок и выберите тип блока Товары."},{"type":"step","marker":"7","level":0,"text":"В открывшемся окне введите название блока (С этим товаром покупают) и нажмите кнопку Создать."},{"type":"step","marker":"8","level":0,"text":"На созданном блоке нажмите на значок шестеренки. В открывшемся окне укажите:"},{"type":"bullet","level":0,"text":"шаблон в поле Шаблон."},{"type":"step","marker":"9","level":0,"text":"Переключитесь на вкладку Контент и в поле Заполнение выберите Вручную."},{"type":"images","files":["blocks-product-03.png"]},{"type":"p","text":"! Тут наполнять товарами не нужно т.к стр. редактирования макета глобальная для всех товаров добавленные тут товары будут во всех товаров"},{"type":"step","marker":"10","level":0,"text":"Выключите блок если вы не желаете чтоб он был во всех товаров."},{"type":"images","files":["blocks-product-04.png"]},{"type":"h2","text":"Шаг 2. Добавляем блок на страницу товара"},{"type":"step","marker":"1","level":0,"text":"В панели администратора откройте Товары → Товары и выберите любой товар."},{"type":"step","marker":"2","level":0,"text":"На странице редактирования товара откройте вкладку Макеты, смените макет на Мобильное приложение"},{"type":"images","files":["blocks-product-05.png"]},{"type":"step","marker":"3","level":0,"text":"Найдите выключенный блок С этим товаром покупают."},{"type":"step","marker":"4","level":0,"text":"Нажмите на значок шестерёнки на блоке и переключитесь на вкладку Контент. Добавьте необходимые товары."},{"type":"step","marker":"5","level":0,"text":"Нажмите Сохранить."},{"type":"step","marker":"6","level":0,"text":"Включите блок."},{"type":"p","text":"После создания или изменения блока убедитесь в том, что он отображается корректно. В некоторых случаях оболочка может быть несовместима с блоком определенного типа."}]},{"id":"blocks-layout","title":"Настройка макета главной страницы","blocks":[{"type":"p","text":"Изначально макеты и блоки имеют настройку главного администратора, но вы можете его настроить индивидуально для своей витрины: для работы с блоками откройте страницу Веб-сайт → Темы → Макеты"},{"type":"images","files":["blocks-layout-01.png"]},{"type":"p","text":"На открывшейся странице выберите"},{"type":"step","marker":"1","level":0,"text":"витрину,"},{"type":"step","marker":"2","level":0,"text":"макет (сайт или мобильное приложение)."},{"type":"images","files":["blocks-layout-02.png"]},{"type":"p","text":"– Выберите где требуется настройка, Домашняя страница или Детальная страница товара."},{"type":"images","files":["blocks-layout-03.png"]},{"type":"p","text":"– Нажмите на Задать конфигурацию. Откроется блоки этой страницы."},{"type":"p","text":"Вы можете менять расположение блоков на странице, добавлять и удалять их, изменять свойства блоков, включать и выключать их, а также добавлять блоки на конкретные страницы."},{"type":"p","text":"Подробно о работе с блоками описано в другой статье."},{"type":"link","text":"статье","url":"https://docs.google.com/document/d/1NOUkZrCS8J_Cvv9f4x9XUlqxsAAyqHig-3LBVzO0nbs/edit?usp=sharing"}]},{"id":"blocks-banner","title":"Как добавить баннер на главную","blocks":[{"type":"h2","text":"Шаг 1. Создание баннера"},{"type":"step","marker":"1.1","level":1,"text":"В панели администратора перейдите на страницу Маркетинг → Баннеры."},{"type":"p","text":"Панель всегда открывается с фильтром “Расширенные баннеры” установите все и нажмите “”Найти”"},{"type":"images","files":["blocks-banner-01.png"]},{"type":"step","marker":"1.2","level":1,"text":"Нажмите справа кнопку + Добавить баннер."},{"type":"step","marker":"1.3","level":1,"text":"Введите название баннера в поле Название."},{"type":"step","marker":"1.4","level":1,"text":"Выберите Тип баннера:"},{"type":"bullet","level":0,"text":"Для Текстового баннера введите текст, который будет на баннере, в поле Описание."},{"type":"bullet","level":0,"text":"Для Графического баннера загрузите изображение и укажите URL страницы, на которую будет вести баннер. Здесь также можно выбрать, открывать ли ссылку на эту странцу в новом окне."},{"type":"p","text":"! Для мобильного приложения используются только графический баннер"},{"type":"step","marker":"1.5","level":1,"text":"Нажмите Создать."},{"type":"images","files":["blocks-banner-02.png"]},{"type":"h2","text":"Шаг 2. Добавление баннера на витрину"},{"type":"step","marker":"2.1","level":1,"text":"Перейдите на страницу Веб-сайт → Темы → Макеты."},{"type":"step","marker":"2.2","level":1,"text":"Выберите страницу макета для вашего баннера, переключившись на соответствующую вкладку. Подробно описано в другой статье"},{"type":"link","text":"статье","url":"https://docs.google.com/document/d/1XPClviopSpUk6itoIsRjwN5i4x_hjl_C8QQpkL-Qq9c/edit?usp=sharing"},{"type":"step","marker":"2.3","level":1,"text":"Выберите секцию, где вы хотите разместить баннер, затем нажмите кнопку + и выберите Добавить блок."},{"type":"step","marker":"2.4","level":1,"text":"Откроется страница добавления блока. Переключитесь на вкладку Создать новый блок и выберите Баннеры."},{"type":"step","marker":"2.5","level":1,"text":"Введите название баннера в поле Название (например, Мой баннер)."},{"type":"images","files":["blocks-banner-03.png"]},{"type":"step","marker":"2.6","level":1,"text":"Перейдите на вкладку Контент, в поле Заполнение выберите Вручную и нажмите кнопку Добавить баннеры, чтобы выбрать баннеры, которые будут отображаться в этом блоке."},{"type":"images","files":["blocks-banner-04.png"]},{"type":"step","marker":"2.7","level":1,"text":"После добавления необходимых баннеров, задайте номера позиций, в соответствии с которыми они будут располагаться."},{"type":"step","marker":"2.8","level":1,"text":"Нажмите Создать, чтобы добавить блок с баннером на витрину."},{"type":"p","text":"После создания или изменения блока убедитесь, что он корректно отображается на витрине, так как не все шаблоны подходят под формат блока."},{"type":"p","text":"Как добавить ссылку в баннер описан в другой статье"},{"type":"link","text":"статье","url":"https://docs.google.com/document/d/1NOUkZrCS8J_Cvv9f4x9XUlqxsAAyqHig-3LBVzO0nbs/edit?tab=t.0#heading=h.ji55gccu6t9j"}]},{"id":"blocks-banner-link","title":"Как добавить ссылку для баннера","blocks":[{"type":"step","marker":"2.1","level":1,"text":"Ссылка показать все. Если указать ссылку, то в блоке в мобильном приложении будет показана кнопка которая будет вести на указанную страницу. Для корректной навигации по приложению ссылки должны быть в строгом формате."},{"type":"h2","text":"Форматы ссылок поддерживаемых ссылок:"},{"type":"step","marker":"1","level":0,"text":"Страница. Если вы хотите чтобы ссылка вела на детальную страницу вид ссылки должен быть: dispatch=categories.view&variant_id=[ид_страницы]"},{"type":"step","marker":"2","level":0,"text":"Страница товара. Если вы хотите чтобы ссылка вела на детальную страницу товара вид ссылки должен быть: dispatch=products.view&product_id=[ид_товара]"},{"type":"step","marker":"3","level":0,"text":"Страница категории. Если вы хотите чтобы ссылка вела на категорию товаров вид ссылки должен быть: dispatch=categories.view&category_id=[ид_категории].\nТак же вы можете добавить дополнительные параметры. (Параметры можно комбинировать)"},{"type":"step","marker":"2.1","level":1,"text":"features_hash, в таком случае ссылка будет вести на страницу категории с примененными фильтрами. Пример ссылки: dispatch=categories.view&category_id=223&features_hash=10-87. В данном случае в приложении при нажатии на ссылку произойдет маршрутизация на страницу Категории с id = 223 и примененным фильтром c id = 10 и выбранным вариантом 87. Параметр features_hash вы можете найти в url на странице категорий на сайте, применив нужные фильтры."},{"type":"step","marker":"2.2","level":1,"text":"variant_id, в таком случае ссылка будет вести на страницу категории с товарами выбранного бренда. В данном случае параметр category_id может быть пустым. Пример ссылки dispatch=categories.view&variant_id=86. В данном случае в приложении при нажатии на ссылку произойдет маршрутизация на страницу Категории с товарами варианта бренда = 86 (Adidas)"},{"type":"step","marker":"2.3","level":1,"text":"tag, в таком случае ссылка будет вести на страницу категории с товарами, которые отмечены тегом. Пример ссылки: dispatch=categories.view&tag=Мужские. Будут показаны товары которые отмечены тегом Мужские"},{"type":"step","marker":"4","level":0,"text":"Страница бренда. Если вы хотите чтобы ссылка вела на детальную страницу бренда вид ссылки должен быть: dispatch=brands.view&variant_id=[ид_варианта_характеристики_бренд]"},{"type":"p","text":"пример - dispatch=categories.view&variant_id=86"}]},{"id":"blocks-similar","title":"Похожие товары (аналоги)","blocks":[{"type":"p","text":"Модуль позволяет создавать неограниченное количество групп похожих или связанных товаров на базе тега, характеристики или добавлять товары вручную. При создании группы выбирается какой тип связки товаров будет использоваться:"},{"type":"p","text":"По тегу"},{"type":"p","text":"По характеристике"},{"type":"p","text":"Ручная привязка, которая делится на три типа:"},{"type":"step","marker":"1","level":0,"text":"Односторонняя связь"},{"type":"step","marker":"2","level":0,"text":"Двусторонняя связь (Товары добавляться друг к другу)"},{"type":"step","marker":"3","level":0,"text":"Перекрестная связь (Все товары будут добавляться друг к другу создавая единую группу товаров)"},{"type":"h2","text":"Настройки:"},{"type":"p","text":"Настраивается в двух этапах как и все блоки добавляемые в карточке товара"},{"type":"step","marker":"1","level":0,"text":"создания блока с глобальной настройкой."},{"type":"step","marker":"2","level":0,"text":"Настройка контента в карточке товара"},{"type":"step","marker":"1","level":0,"text":"Создания блока с глобальной настройкой"},{"type":"p","text":"Перейдите на страницу настройки макета как описано в другой статье"},{"type":"link","text":"статье","url":"https://docs.google.com/document/d/1XPClviopSpUk6itoIsRjwN5i4x_hjl_C8QQpkL-Qq9c/edit?usp=sharing"},{"type":"p","text":"Выберите настройку Детальная страница товара. Добавьте блок Похожие. (как добавлять блоки описано в статье Редактирование блоков)"},{"type":"link","text":"Редактирование блоков","url":"https://docs.google.com/document/d/1NOUkZrCS8J_Cvv9f4x9XUlqxsAAyqHig-3LBVzO0nbs/edit?usp=sharing"},{"type":"p","text":"Перейдите на страницу контент и заполните поля:"},{"type":"step","marker":"1","level":0,"text":"Заполнение – Выберите Связанные товары"},{"type":"step","marker":"2","level":0,"text":"Связанные товары – Выберите желаемое"},{"type":"p","text":"И т.д. все остальные поля"},{"type":"images","files":["blocks-similar-01.png"]},{"type":"step","marker":"2","level":0,"text":"Настройка контента в карточке товара"},{"type":"p","text":"Выберите товар которому желаете добавить похожие товара, перейдите на страницу Связанные товары и заполните похожие товары в полях:"},{"type":"step","marker":"1","level":0,"text":"Ручная привязка, которая делится на три типа:"},{"type":"step","marker":"1.1","level":1,"text":"Односторонняя связь"},{"type":"step","marker":"1.2","level":1,"text":"Двусторонняя связь (Товары добавляться друг к другу)"},{"type":"step","marker":"1.3","level":1,"text":"Перекрестная связь (Все товары будут добавляться друг к другу создавая единую группу товаров)"},{"type":"step","marker":"2","level":0,"text":"По тегу"},{"type":"step","marker":"3","level":0,"text":"По характеристике"},{"type":"p","text":"Нажмите Сохранить"},{"type":"p","text":"Вы можете связывать сразу по всем трем параметрам ручной, тегу и характеристику"},{"type":"images","files":["blocks-similar-02.png"]},{"type":"p","text":"Перейдите в настройку товара которые добавляете и убедитесь что товары привязалась и к другим привязанным товаром в соответствии настройке"},{"type":"p","text":"Перейдите на страницу Макеты, выберите витрину и включите блок Похожие"},{"type":"images","files":["blocks-similar-03.png"]},{"type":"p","text":"Откройте витрину/приложение и убедитесь что настройка сработала."}]}]},{"id":"marketing","title":"Маркетинг","icon":"marketing","description":"Баннеры, промоакции, лояльность и аналитика","articles":[{"id":"marketing-banner-sizes","title":"Размеры баннеров","blocks":[{"type":"h2","text":"Мобильное приложение"},{"type":"table","rows":[["","Ширина (рх)","max Высота (рх)"],["Маленький баннер","375","200"],["Большой баннер","375","300"]]},{"type":"h2","text":"Сайт"},{"type":"table","rows":[["","Ширина","max Высота (рх)"],["Сайт","1500-2000","550"],["Мобильная версия сайта","","400"],["","",""]]},{"type":"h2","text":"Карточка товара"},{"type":"table","rows":[["Фото карточки товаров","до 1000х1000","1200"]]},{"type":"h2","text":"Нижний баннер"},{"type":"table","rows":[["","Ширина","max Высота (рх)"],["Сайт","","250"],["Мобильная версия сайта","","200"]]},{"type":"p","text":"Размеры рекомендуемые и не являются обязательным, и могут варьироваться в меньшую сторону до 20% (за исключение мобильного приложения)."},{"type":"p","text":"При разработке несколько баннеров на одну позицию к примеру Основной баннер (сайт), то высота должна быть на все баннеры одинаковы."},{"type":"p","text":"Размеры не должны превышать 700КБ чем больше размер тем дольше загружается страница"}]},{"id":"marketing-banner","title":"Как добавить баннер на главную","blocks":[{"type":"h2","text":"Шаг 1. Создание баннера"},{"type":"step","marker":"1.1","level":1,"text":"В панели администратора перейдите на страницу Маркетинг → Баннеры."},{"type":"p","text":"Панель всегда открывается с фильтром “Расширенные баннеры” установите все и нажмите “”Найти”"},{"type":"images","files":["blocks-banner-01.png"]},{"type":"step","marker":"1.2","level":1,"text":"Нажмите справа кнопку + Добавить баннер."},{"type":"step","marker":"1.3","level":1,"text":"Введите название баннера в поле Название."},{"type":"step","marker":"1.4","level":1,"text":"Выберите Тип баннера:"},{"type":"bullet","level":0,"text":"Для Текстового баннера введите текст, который будет на баннере, в поле Описание."},{"type":"bullet","level":0,"text":"Для Графического баннера загрузите изображение и укажите URL страницы, на которую будет вести баннер. Здесь также можно выбрать, открывать ли ссылку на эту странцу в новом окне."},{"type":"p","text":"! Для мобильного приложения используются только графический баннер"},{"type":"step","marker":"1.5","level":1,"text":"Нажмите Создать."},{"type":"images","files":["blocks-banner-02.png"]},{"type":"h2","text":"Шаг 2. Добавление баннера на витрину"},{"type":"step","marker":"2.1","level":1,"text":"Перейдите на страницу Веб-сайт → Темы → Макеты."},{"type":"step","marker":"2.2","level":1,"text":"Выберите страницу макета для вашего баннера, переключившись на соответствующую вкладку. Подробно описано в другой статье"},{"type":"link","text":"статье","url":"https://docs.google.com/document/d/1XPClviopSpUk6itoIsRjwN5i4x_hjl_C8QQpkL-Qq9c/edit?usp=sharing"},{"type":"step","marker":"2.3","level":1,"text":"Выберите секцию, где вы хотите разместить баннер, затем нажмите кнопку + и выберите Добавить блок."},{"type":"step","marker":"2.4","level":1,"text":"Откроется страница добавления блока. Переключитесь на вкладку Создать новый блок и выберите Баннеры."},{"type":"step","marker":"2.5","level":1,"text":"Введите название баннера в поле Название (например, Мой баннер)."},{"type":"images","files":["blocks-banner-03.png"]},{"type":"step","marker":"2.6","level":1,"text":"Перейдите на вкладку Контент, в поле Заполнение выберите Вручную и нажмите кнопку Добавить баннеры, чтобы выбрать баннеры, которые будут отображаться в этом блоке."},{"type":"images","files":["blocks-banner-04.png"]},{"type":"step","marker":"2.7","level":1,"text":"После добавления необходимых баннеров, задайте номера позиций, в соответствии с которыми они будут располагаться."},{"type":"step","marker":"2.8","level":1,"text":"Нажмите Создать, чтобы добавить блок с баннером на витрину."},{"type":"p","text":"После создания или изменения блока убедитесь, что он корректно отображается на витрине, так как не все шаблоны подходят под формат блока."},{"type":"p","text":"Как добавить ссылку в баннер описан в другой статье"},{"type":"link","text":"статье","url":"https://docs.google.com/document/d/1NOUkZrCS8J_Cvv9f4x9XUlqxsAAyqHig-3LBVzO0nbs/edit?tab=t.0#heading=h.ji55gccu6t9j"}]},{"id":"marketing-messages","title":"Центр сообщений","blocks":[{"type":"p","text":"Когда покупатель нажимает на кнопку Оставить отзыв (список заказов, кнопка появляется когда заказ приобретет статус Выдан), Обратная связь или задать вопрос (детальная страница заказа), то этот вопрос и вся переписка по этой теме между продавцом (администратором) и покупателем сохраняется в базе данных."},{"type":"images","files":["marketing-messages-01.jpg"]},{"type":"images","files":["marketing-messages-02.png"]},{"type":"p","text":"И в панели администратора, и на витрине есть “Центр сообщений”. Там администраторы, покупатели и продавцы могут посмотреть историю общения по разным вопросам и продолжить его."},{"type":"h2","text":"Центр сообщений для администраторов и продавцов"},{"type":"p","text":"В панели администратора есть страница Покупатели → Центр сообщений. Там администраторы и продавцы могут:"},{"type":"bullet","level":0,"text":"просматривать вопросы покупателей: если вопрос пока не просмотрел администратор, этот вопрос будет подсвечен;"},{"type":"bullet","level":0,"text":"отвечать в существующих вопросах: для этого нажмите на ID вопроса, впишите ваше сообщение и нажмите кнопку Отправить;"},{"type":"bullet","level":0,"text":"удалять вопрос со всеми ответами: для этого напишите главному администратору номер сообщения с просьбой удалить.\nВ платформе wikki удалять вопросы могут только главные администраторы самого маркетплейса (а не администраторы продавца)."},{"type":"h2","text":"Центр сообщений для покупателей"},{"type":"p","text":"На витрине есть страница Мой профиль → Сообщения. Там покупатели могут:"},{"type":"bullet","level":0,"text":"просматривать свои вопросы: если на них пришел ответ, то эти вопросы будут помечены;"},{"type":"bullet","level":0,"text":"отправлять новые сообщения в уже существующих вопросах:"},{"type":"bullet","level":0,"text":"Создавать новое сообщение выбрав магазин: для этого нажмите на Написать в списке сообщений и выберите магазин. Администратор магазина получит сообщение."},{"type":"images","files":["marketing-messages-03.png"]}]},{"id":"marketing-page","title":"Как создать страницу","blocks":[{"type":"p","text":"Перейдите в меню Веб сайт → Страницы. В правом верхнем углу нажмите на Добавить страницу."},{"type":"images","files":["marketing-page-01.png"]},{"type":"p","text":"В открывшемся странице наполните названия страницы далее заполните поле Описания."},{"type":"images","files":["marketing-page-02.png"]}]},{"id":"marketing-promos","title":"Промоакции и скидки","blocks":[{"type":"p","text":"Промо-акции дают покупателям определённые бонусы (например, скидки или бесплатные товары), если выполняются заданные условия."},{"type":"p","text":"Список всех действующих в магазине промо-акций вы можете увидеть на специальной странице витрины"},{"type":"h2","text":"Как настроить промоакцию"},{"type":"link","text":"Как настроить промоакцию","url":"https://docs.google.com/document/d/1Uz-2ow65EvoiTuKJ8t01aditwy2_wQo907gHSImJ_n8/edit?usp=sharing"},{"type":"p","text":"При создании любой промоакции выберите первым условием: Применять к заказам из 1C (API) или Не применять к заказам из 1C (API)"},{"type":"p","text":"Применять к заказам из 1C (API) — промоакция применяется только для заказов загруженных из 1с. И НЕ будет применятся для заказов с сайта и приложения."},{"type":"p","text":"Не применять к заказам из 1C (API) — промоакция не будет применятся для заказов созданных в 1с. Будет применяться только для заказов созданных на сайте или в приложении."},{"type":"warning","text":"P.S если не установить не одну из этих условий то промоакция применится ко всем заказам. Созданным на сайте, в приложении и выгруженных из 1с."},{"type":"h2","text":"Виды промоакций"},{"type":"p","text":"Есть два вида промо-акций:"},{"type":"bullet","level":0,"text":"Промо-акции для каталога позволяют задавать скидки на товары и категории товаров, а также указывать, при каких условиях эти скидки применяются. Скидки отображаются прямо в каталоге: на страницах товаров и категорий."},{"type":"bullet","level":0,"text":"Промо-акции для корзины также позволяют задавать скидки и другие бонусы: бесплатные товары, начисление бонусных баллов, членство в группе пользователей, и т.п. Список возможных условий и бонусов больше, чем у промо-акций для каталога. Сами бонусы не отображаются в каталоге, а только на страницах корзины и оформления заказа."},{"type":"h2","text":"Примеры настройки промоакций"},{"type":"p","text":"В этом разделе приведены пошаговые инструкции по настройке различных промо-акций."},{"type":"bullet","level":0,"text":"Как задать скидку на товары из определённых категорий"},{"type":"link","text":"Как задать скидку на товары из определённых категорий","url":"https://docs.google.com/document/d/1CZ5AVEQ72wiP1eSMIuP_t8Z2SWBQlkfHK2-h5ZXbx_k/edit?usp=sharing"},{"type":"bullet","level":0,"text":"Как задать скидку при определённом количестве товаров в корзине"},{"type":"link","text":"Как задать скидку при определённом количестве товаров в корзине","url":"https://docs.google.com/document/d/1DbXs7S16-rN4FLhvRN24dvm-obmX8SndrDwL-fO_fdg/edit?usp=sharing"},{"type":"bullet","level":0,"text":"Как задать скидку на заказ при определённой сумме заказа"},{"type":"link","text":"Как задать скидку на заказ при определённой сумме заказа","url":"https://docs.google.com/document/d/1KmIy4m-6FAuKuTfdM1Y2IWpObDkao3EkBKWez6D8I-U/edit?usp=sharing"},{"type":"bullet","level":0,"text":"Как задать скидку на заказ при покупке двух определённых товаров вместе"},{"type":"link","text":"Как задать скидку на заказ при покупке двух определённых товаров вместе","url":"https://docs.google.com/document/d/1-dsiNbrMDyeyHefzqpmzdibtTRn2Sr1gto9bVLoTgaU/edit?usp=sharing"},{"type":"bullet","level":0,"text":"Как подарить товар при определённой сумме заказа"},{"type":"link","text":"Как подарить товар при определённой сумме заказа","url":"https://docs.google.com/document/d/152kYBkzzH6un0Xnxr59xvInAU6tr0-lQZarVim1815c/edit?usp=sharing"},{"type":"bullet","level":0,"text":"Как предложить скидку пользователям из определённой группы"},{"type":"link","text":"Как предложить скидку пользователям из определённой группы","url":"https://docs.google.com/document/d/1O4F8X0qN8w9yjGHVYwfHxUReFrgkcqlFE5-jbslxR4I/edit?usp=sharing"},{"type":"bullet","level":0,"text":"Как настроить период действия промо-акции"},{"type":"link","text":"Как настроить период действия промо-акции","url":"https://docs.google.com/document/d/1HMbed6joCejHyLtVzdPdspTxK4_HwdRQOF5h5fFS87o/edit?usp=sharing"}]},{"id":"marketing-coupon","title":"Как создать бонусный купон","blocks":[{"type":"p","text":"Бонусный купон — это промо-акция для корзины. Покупатель вводит код при оформлении заказа и получает заданный бонус: скидку на заказ, бесплатную доставку, подарок или другой доступный вариант."},{"type":"h2","text":"Важно"},{"type":"p","text":"Создавайте купон как промо-акцию для корзины. Перед включением проверьте код на тестовом заказе."},{"type":"h2","text":"Как создать купон"},{"type":"step","marker":"1","level":0,"text":"Откройте раздел Маркетинг → Промо-акции и скидки."},{"type":"step","marker":"2","level":0,"text":"Нажмите Добавить промо-акцию и выберите Добавить промо-акцию для корзины."},{"type":"step","marker":"3","level":0,"text":"На вкладке Общее укажите понятное название промо-акции."},{"type":"images","files":["marketing-coupon-01.jpg"]},{"type":"p","text":"Вкладка «Общее»: название и основные настройки купона."},{"type":"step","marker":"4","level":0,"text":"При необходимости задайте период доступности и выберите витрину, на которой должен работать купон."},{"type":"step","marker":"5","level":0,"text":"Оставьте статус Выкл., пока настройка и проверка не закончены."},{"type":"step","marker":"6","level":0,"text":"Перейдите на вкладку Условия и нажмите Добавить условие."},{"type":"step","marker":"7","level":0,"text":"Выберите условие Код купона."},{"type":"step","marker":"8","level":0,"text":"Настройте один или несколько кодов:"},{"type":"step","marker":"9","level":0,"text":"Для одного кода выберите равно и введите код без запятых."},{"type":"step","marker":"10","level":0,"text":"Для нескольких кодов выберите в списке и введите коды через запятую без пробелов, например: SALE10,SALE15,SALE20."},{"type":"step","marker":"11","level":0,"text":"При необходимости добавьте условие Один раз для покупателя, чтобы ограничить повторное использование."},{"type":"images","files":["marketing-coupon-02.jpg"]},{"type":"p","text":"Вкладка «Условия»: код купона и ограничения использования."},{"type":"step","marker":"12","level":0,"text":"Перейдите на вкладку Бонусы и нажмите Добавить бонус."},{"type":"step","marker":"13","level":0,"text":"Выберите нужный бонус и задайте его значение. Например, для скидки 20% выберите Скидка на заказ → на процент от исходной цены и укажите 20."},{"type":"images","files":["marketing-coupon-03.jpg"]},{"type":"p","text":"Вкладка «Бонусы»: пример скидки 20% на заказ."},{"type":"step","marker":"14","level":0,"text":"Нажмите Создать или Сохранить."},{"type":"step","marker":"15","level":0,"text":"После проверки переведите промо-акцию в статус Вкл."},{"type":"h2","text":"Как проверить купон"},{"type":"step","marker":"1","level":0,"text":"Добавьте товар в корзину в Potolcom Pro."},{"type":"step","marker":"2","level":0,"text":"Перейдите к оформлению заказа."},{"type":"step","marker":"3","level":0,"text":"Введите код купона."},{"type":"step","marker":"4","level":0,"text":"Убедитесь, что появился заданный бонус и итоговая сумма изменилась правильно."},{"type":"step","marker":"5","level":0,"text":"Проверьте, что купон не действует вне заданного периода, витрины или других условий."},{"type":"h2","text":"Важно"},{"type":"p","text":"Коды чувствительны к точному написанию. Для нескольких кодов используйте запятые без пробелов."}]},{"id":"marketing-auto-coupon","title":"Как автоматически генерировать купоны","blocks":[{"type":"p","text":"Автоматическая генерация позволяет выдавать каждому покупателю уникальный код после выполнения заданного условия. Для этого нужны две промо-акции для корзины:"},{"type":"bullet","level":0,"text":"Первая промо-акция применяет бонус по сгенерированному коду."},{"type":"bullet","level":0,"text":"Вторая промо-акция создаёт и выдаёт код покупателю."},{"type":"h2","text":"Важно"},{"type":"p","text":"Покупатель не сможет применить код в том же заказе, за который этот код был получен."},{"type":"h2","text":"Шаг 1. Создайте купон, который применяет бонус"},{"type":"step","marker":"1","level":0,"text":"Откройте раздел Маркетинг → Промо-акции и скидки."},{"type":"step","marker":"2","level":0,"text":"Нажмите Добавить промо-акцию и выберите Добавить промо-акцию для корзины."},{"type":"step","marker":"3","level":0,"text":"На вкладке Общее укажите название, например Бонусный купон — скидка на следующий заказ."},{"type":"step","marker":"4","level":0,"text":"Оставьте статус Выкл. до завершения настройки и проверки."},{"type":"step","marker":"5","level":0,"text":"Перейдите на вкладку Условия и нажмите Добавить условие."},{"type":"step","marker":"6","level":0,"text":"Выберите Автоматически сгенерированные коды купонов. Надпись Здесь пока ничего нет означает, что коды ещё не создавались."},{"type":"images","files":["marketing-auto-coupon-01.jpg"]},{"type":"p","text":"Первая промоакция: приём автоматически сгенерированных кодов."},{"type":"step","marker":"7","level":0,"text":"Добавьте условие Один раз для покупателя, если один код должен использоваться только один раз."},{"type":"step","marker":"8","level":0,"text":"Перейдите на вкладку Бонусы и выберите нужный бонус: скидку, бесплатную доставку, подарок или другой доступный вариант."},{"type":"images","files":["marketing-auto-coupon-02.jpg"]},{"type":"p","text":"Первая промоакция: бонус, который получит покупатель."},{"type":"step","marker":"9","level":0,"text":"Сохраните промо-акцию."},{"type":"h2","text":"Шаг 2. Создайте промо-акцию, которая выдаёт коды"},{"type":"step","marker":"1","level":0,"text":"Вернитесь в раздел Маркетинг → Промо-акции и скидки."},{"type":"step","marker":"2","level":0,"text":"Создайте ещё одну промо-акцию для корзины."},{"type":"step","marker":"3","level":0,"text":"На вкладке Общее укажите название, например Выдать купон после заказа."},{"type":"step","marker":"4","level":0,"text":"Оставьте статус Выкл. до проверки."},{"type":"step","marker":"5","level":0,"text":"На вкладке Условия задайте правило выдачи купона. Например: Предварительная стоимость заказа → больше или равно → нужная сумма."},{"type":"images","files":["marketing-auto-coupon-03.jpg"]},{"type":"p","text":"Вторая промоакция: условие, при котором покупателю выдаётся код."},{"type":"step","marker":"6","level":0,"text":"Добавьте условие Один раз для покупателя, чтобы одному покупателю был создан только один код."},{"type":"step","marker":"7","level":0,"text":"Перейдите на вкладку Бонусы и нажмите Добавить бонус."},{"type":"step","marker":"8","level":0,"text":"Выберите Предоставить купон."},{"type":"step","marker":"9","level":0,"text":"В соседнем списке выберите промо-акцию, созданную на шаге 1."},{"type":"images","files":["marketing-auto-coupon-04.jpg"]},{"type":"p","text":"Вторая промоакция: бонус «Предоставить купон»."},{"type":"step","marker":"10","level":0,"text":"Сохраните промо-акцию."},{"type":"h2","text":"Как проверить автоматическую выдачу"},{"type":"step","marker":"1","level":0,"text":"Включите обе промо-акции только на время теста."},{"type":"step","marker":"2","level":0,"text":"Оформите в Potolcom Pro тестовый заказ, который соответствует условию выдачи."},{"type":"step","marker":"3","level":0,"text":"Переведите заказ в статус, уменьшающий количество товара в наличии. Статус Открытый для этого не подходит."},{"type":"step","marker":"4","level":0,"text":"Проверьте страницу заказа: сгенерированный код должен отображаться в информации о заказе."},{"type":"step","marker":"5","level":0,"text":"В панели администратора откройте Заказы → Все заказы → нужный заказ → Промо-акции и проверьте созданный код."},{"type":"step","marker":"6","level":0,"text":"Откройте первую промо-акцию и убедитесь, что код появился на вкладке Условия."},{"type":"step","marker":"7","level":0,"text":"Создайте новый тестовый заказ и проверьте применение кода."},{"type":"h2","text":"Важно"},{"type":"p","text":"Код не отправится покупателю и не начнёт работать, пока заказ не получит статус, в настройках которого количество товара в наличии уменьшается."},{"type":"p","text":"Если обе промо-акции должны работать только для заказов из приложения или только для заказов из 1С, добавьте соответствующее условие платформы из вашей базы знаний."},{"type":"p","text":"После теста оставьте активными только правильно настроенные промо-акции."}]},{"id":"marketing-loyalty","title":"Программа лояльности","blocks":[{"type":"h2","text":"Что делает модуль"},{"type":"p","text":"Накопительная скидка или бонус — это автоматическая скидка, размер которой растёт вместе с суммой ранее оформленных заказов клиента. Чем больше монтажник заказал у вас за период, тем выше его персональный процент скидки."},{"type":"p","text":"Пример:"},{"type":"table","rows":[["Уровень","Накоплено заказов (за период)","Скидка"],["Basic","0 – 49999 ₽","3 %"],["Silver","50 000 – 99999 ₽","5 %"],["Gold","от 100 000 ₽","7 %"]]},{"type":"p","text":"Названия уровней — для вашего удобства и для отображения в кабинете. Модуль оперирует диапазонами сумм и процентами."},{"type":"h2","text":"Настройка"},{"type":"p","text":"Работа модуля основана на группах пользователей. Клиент получает бонусы и скидки в зависимости от того, к какой группе пользователей он относится."},{"type":"step","marker":"1","level":0,"text":"Если у вас не создана группа для пользователей создайте по этой инструкции"},{"type":"link","text":"инструкции","url":"https://docs.google.com/document/d/1RwlBcLCde54Hu9LJeHBxx7daRhQ-xxAtY7JYLAHB8P0/edit?usp=sharing"},{"type":"step","marker":"2","level":0,"text":"Откройте страницу Маркетинг → Программа лояльности в панели администратора"},{"type":"step","marker":"3","level":0,"text":"Нажмита на плюс в провом верхнем углу"},{"type":"step","marker":"4","level":0,"text":"Заполните поля формы."},{"type":"step","marker":"4.1","level":1,"text":"Название — название группы."},{"type":"bullet","level":2,"text":"Сумма — задайте сумму, при достижении этой суммы покупки за определенный период покупатель перейдет в этот группу."},{"type":"bullet","level":2,"text":"Группа. — выберите группу."},{"type":"bullet","level":2,"text":"Применять бонусные баллы к товарам со скидкой — поставьте галочку если хотите чтоб скидка суммировалось с остальными скидками."},{"type":"bullet","level":2,"text":"Изображение — Изображение групп будет выводится на сайте на стр. аккаунта."},{"type":"step","marker":"5","level":0,"text":"Нажмите кнопку Сохранить. Новая группа появится в списке."},{"type":"h2","text":"Промоакции"},{"type":"p","text":"Далее для каждой групп пользователей необхадимо создать промо-акцию по этой инструкции,"},{"type":"link","text":"инструкции","url":"https://docs.google.com/document/d/1Uz-2ow65EvoiTuKJ8t01aditwy2_wQo907gHSImJ_n8/edit?usp=sharing"},{"type":"p","text":"Когда пользователи достигнут нужного уровня и переключатся к следующей группе, будет срабатывать соответствующая промо-акция"},{"type":"p","text":"Для настройки пользователей которых необходимо исключить из автоматического переключения по группам."},{"type":"bullet","level":0,"text":"Перейдите в настройку пользователя"},{"type":"bullet","level":0,"text":"установите галочку напротив “Не изменять статус лояльности:”"},{"type":"images","files":["marketing-loyalty-01.png"]},{"type":"h2","text":"Промоакции"},{"type":"p","text":"Далее для каждой групп пользователей необхадимо создать промо-акцию по этой инструкции,"},{"type":"p","text":"Когда пользователи достигнут нужного уровня и переключатся к следующей группе, будет срабатывать соответствующая промо-акция"}]},{"id":"marketing-unit-price","title":"Цена за единицу","blocks":[{"type":"p","text":"Добавлен модуль, который позволяет указывать цену за единицу товара (литр, миллилитр, килограмм и т. д.)"},{"type":"p","text":"Если в вашем магазине выставлены на продажу несколько товаров в упаковке или коробке, то такую группу товаров выгодно продавать со скидкой. Когда покупатель видит, сколько можно сэкономить, приобретая сразу несколько товаров в одной коробке, ему легче принять решение о покупке. С помощью модуля “Цена за единицу” можно указать на витрине цену за единицу и за группу товаров."},{"type":"images","files":["product-unit-price-01.png"]},{"type":"h2","text":"Функциональность"},{"type":"p","text":"В панели администратора на странице редактирования товара добавлен раздел «Цена за единицу». Там вы указываете желаемую единицу измерения, например «мл», «г» или «шт», и количество единиц в товаре. Также укажите количество единиц, для которых будет отображаться цена, если вам нужно, чтобы цена была «за 1 шт» или «за 250 мл» вместо «за мл»."},{"type":"images","files":["product-unit-price-02.png"]},{"type":"p","text":"Например, продается коробка с 200 дюбеля. На витрине, на списке товаров и на странице с самим товаром, цена за один появится автоматически. Для этого в настройках нужно указать единицу измерения «шт» и количество единиц в товаре «200»."}]},{"id":"marketing-metrika","title":"Яндекс.Метрика","blocks":[{"type":"h2","text":"Шаг 1. Создание и настройка счетчика"},{"type":"step","marker":"1","level":0,"text":"Откройте страницу Яндекс.Метрики и авторизуйтесь."},{"type":"link","text":"Яндекс.Метрики","url":"https://metrika.yandex.ru/"},{"type":"step","marker":"2","level":0,"text":"Нажмите кнопку Добавить счётчик."},{"type":"step","marker":"3","level":0,"text":"На вкладке “Задайте настройки” заполните необходимые поля:"},{"type":"bullet","level":1,"text":"Имя счётчика — введите название счётчика."},{"type":"bullet","level":1,"text":"Адрес сайта — введите адрес вашего магазина."},{"type":"bullet","level":1,"text":"Часовой пояс — выберите ваш часовой пояс."},{"type":"step","marker":"4","level":0,"text":"Включите настройку Вебвизор, карта скроллинга, аналитика форм, чтобы собирать и анализировать подробные данные о посетителях вашего магазина."},{"type":"step","marker":"5","level":0,"text":"Поставьте галочку согласия с условиями пользовательского соглашения и нажмите Создать счётчик."},{"type":"images","files":["marketing-metrika-01.png"]},{"type":"step","marker":"6","level":0,"text":"На вкладке “Установите код счетчика на сайт” переключитесь на вкладку CMS и конструкторы сайта."},{"type":"step","marker":"7","level":0,"text":"Скопируйте код счётчика — его необходимо будет прислать нам. Также его можно скопировать со страницы с детальной информацией о счётчике."},{"type":"images","files":["marketing-metrika-02.png"]},{"type":"step","marker":"8","level":0,"text":"Пролистайте вниз и нажмите Начать пользоваться."},{"type":"h2","text":"Шаг 2. Получение API Яндекс.Метрики"},{"type":"p","text":"Для того, чтобы получить API Яндекс.Метрики, вам необходимо зарегистрировать приложение на Яндекс.OAuth."},{"type":"link","text":"приложение на Яндекс.OAuth","url":"https://oauth.yandex.ru/client/new"},{"type":"step","marker":"1","level":0,"text":"На странице создания приложения заполните необходимые поля:"},{"type":"bullet","level":1,"text":"Название приложения — введите название приложения."},{"type":"bullet","level":1,"text":"Описание приложения — введите краткое описание вашего приложения."},{"type":"bullet","level":1,"text":"Ссылка на сайт приложения — укажите ссылку на сайт вашего магазина."},{"type":"step","marker":"2","level":0,"text":"В разделе “Платформы” выберите Веб-сервисы."},{"type":"step","marker":"3","level":0,"text":"В поле Callback URI #1 введите Callback URI. Его нужно получить прислав запрос в техподдержку."},{"type":"step","marker":"4","level":0,"text":"В разделе “Доступы” найдите Яндекс.Метрику и включите все доступы."},{"type":"step","marker":"5","level":0,"text":"Нажмите Создать приложение. Откроется страница с информацией о вашем приложении. Данные с этой страницы нужно прислать нам."},{"type":"images","files":["marketing-metrika-03.png"]},{"type":"bullet","level":1,"text":"Цели — выберите, по каким целям хотите собирать статистику. Выбранные цели настроятся в вашем счётчике автоматически."},{"type":"images","files":["marketing-metrika-04.png"]},{"type":"p","text":"В разделе “Доступ к API Яндекса” нажмите Обновить токен, затем авторизуйтесь."}]},{"id":"marketing-banner-link","title":"Как добавить ссылку для баннера","blocks":[{"type":"step","marker":"2.1","level":1,"text":"Ссылка показать все. Если указать ссылку, то в блоке в мобильном приложении будет показана кнопка которая будет вести на указанную страницу. Для корректной навигации по приложению ссылки должны быть в строгом формате."},{"type":"h2","text":"Форматы ссылок поддерживаемых ссылок:"},{"type":"step","marker":"1","level":0,"text":"Страница. Если вы хотите чтобы ссылка вела на детальную страницу вид ссылки должен быть: dispatch=categories.view&variant_id=[ид_страницы]"},{"type":"step","marker":"2","level":0,"text":"Страница товара. Если вы хотите чтобы ссылка вела на детальную страницу товара вид ссылки должен быть: dispatch=products.view&product_id=[ид_товара]"},{"type":"step","marker":"3","level":0,"text":"Страница категории. Если вы хотите чтобы ссылка вела на категорию товаров вид ссылки должен быть: dispatch=categories.view&category_id=[ид_категории].\nТак же вы можете добавить дополнительные параметры. (Параметры можно комбинировать)"},{"type":"step","marker":"2.1","level":1,"text":"features_hash, в таком случае ссылка будет вести на страницу категории с примененными фильтрами. Пример ссылки: dispatch=categories.view&category_id=223&features_hash=10-87. В данном случае в приложении при нажатии на ссылку произойдет маршрутизация на страницу Категории с id = 223 и примененным фильтром c id = 10 и выбранным вариантом 87. Параметр features_hash вы можете найти в url на странице категорий на сайте, применив нужные фильтры."},{"type":"step","marker":"2.2","level":1,"text":"variant_id, в таком случае ссылка будет вести на страницу категории с товарами выбранного бренда. В данном случае параметр category_id может быть пустым. Пример ссылки dispatch=categories.view&variant_id=86. В данном случае в приложении при нажатии на ссылку произойдет маршрутизация на страницу Категории с товарами варианта бренда = 86 (Adidas)"},{"type":"step","marker":"2.3","level":1,"text":"tag, в таком случае ссылка будет вести на страницу категории с товарами, которые отмечены тегом. Пример ссылки: dispatch=categories.view&tag=Мужские. Будут показаны товары которые отмечены тегом Мужские"},{"type":"step","marker":"4","level":0,"text":"Страница бренда. Если вы хотите чтобы ссылка вела на детальную страницу бренда вид ссылки должен быть: dispatch=brands.view&variant_id=[ид_варианта_характеристики_бренд]"},{"type":"p","text":"пример - dispatch=categories.view&variant_id=86"}]},{"id":"marketing-similar","title":"Похожие товары (аналоги)","blocks":[{"type":"p","text":"Модуль позволяет создавать неограниченное количество групп похожих или связанных товаров на базе тега, характеристики или добавлять товары вручную. При создании группы выбирается какой тип связки товаров будет использоваться:"},{"type":"p","text":"По тегу"},{"type":"p","text":"По характеристике"},{"type":"p","text":"Ручная привязка, которая делится на три типа:"},{"type":"step","marker":"1","level":0,"text":"Односторонняя связь"},{"type":"step","marker":"2","level":0,"text":"Двусторонняя связь (Товары добавляться друг к другу)"},{"type":"step","marker":"3","level":0,"text":"Перекрестная связь (Все товары будут добавляться друг к другу создавая единую группу товаров)"},{"type":"h2","text":"Настройки:"},{"type":"p","text":"Настраивается в двух этапах как и все блоки добавляемые в карточке товара"},{"type":"step","marker":"1","level":0,"text":"создания блока с глобальной настройкой."},{"type":"step","marker":"2","level":0,"text":"Настройка контента в карточке товара"},{"type":"step","marker":"1","level":0,"text":"Создания блока с глобальной настройкой"},{"type":"p","text":"Перейдите на страницу настройки макета как описано в другой статье"},{"type":"link","text":"статье","url":"https://docs.google.com/document/d/1XPClviopSpUk6itoIsRjwN5i4x_hjl_C8QQpkL-Qq9c/edit?usp=sharing"},{"type":"p","text":"Выберите настройку Детальная страница товара. Добавьте блок Похожие. (как добавлять блоки описано в статье Редактирование блоков)"},{"type":"link","text":"Редактирование блоков","url":"https://docs.google.com/document/d/1NOUkZrCS8J_Cvv9f4x9XUlqxsAAyqHig-3LBVzO0nbs/edit?usp=sharing"},{"type":"p","text":"Перейдите на страницу контент и заполните поля:"},{"type":"step","marker":"1","level":0,"text":"Заполнение – Выберите Связанные товары"},{"type":"step","marker":"2","level":0,"text":"Связанные товары – Выберите желаемое"},{"type":"p","text":"И т.д. все остальные поля"},{"type":"images","files":["blocks-similar-01.png"]},{"type":"step","marker":"2","level":0,"text":"Настройка контента в карточке товара"},{"type":"p","text":"Выберите товар которому желаете добавить похожие товара, перейдите на страницу Связанные товары и заполните похожие товары в полях:"},{"type":"step","marker":"1","level":0,"text":"Ручная привязка, которая делится на три типа:"},{"type":"step","marker":"1.1","level":1,"text":"Односторонняя связь"},{"type":"step","marker":"1.2","level":1,"text":"Двусторонняя связь (Товары добавляться друг к другу)"},{"type":"step","marker":"1.3","level":1,"text":"Перекрестная связь (Все товары будут добавляться друг к другу создавая единую группу товаров)"},{"type":"step","marker":"2","level":0,"text":"По тегу"},{"type":"step","marker":"3","level":0,"text":"По характеристике"},{"type":"p","text":"Нажмите Сохранить"},{"type":"p","text":"Вы можете связывать сразу по всем трем параметрам ручной, тегу и характеристику"},{"type":"images","files":["blocks-similar-02.png"]},{"type":"p","text":"Перейдите в настройку товара которые добавляете и убедитесь что товары привязалась и к другим привязанным товаром в соответствии настройке"},{"type":"p","text":"Перейдите на страницу Макеты, выберите витрину и включите блок Похожие"},{"type":"images","files":["blocks-similar-03.png"]},{"type":"p","text":"Откройте витрину/приложение и убедитесь что настройка сработала."}]},{"id":"marketing-qr","title":"QR-коды товаров","blocks":[{"type":"p","text":"QR-коды позволяют быстро находить товары в мобильном приложении без ручного поиска."},{"type":"p","text":"Достаточно открыть поиск, отсканировать QR-код, и приложение сразу откроет нужный товар. В QR-коде зашифрован только код товара, поэтому при сканировании всегда отображается актуальная информация из вашей базы: название, цена, остатки и другие данные."},{"type":"p","text":"Главное преимущество — QR-коды не нужно менять при каждом изменении цены. Даже если стоимость товара изменилась после новой поставки, достаточно обновить цены в 1С — приложение автоматически покажет актуальную цену при сканировании."},{"type":"p","text":"В этой инструкции показано, как массово сгенерировать QR-коды для товаров и подготовить их к печати."},{"type":"step","marker":"1","level":0,"text":"Откройте страницу Товары → Товары в панели администратора."},{"type":"step","marker":"2","level":0,"text":"Выделите нужные товары нажите Действия и выберите Сгенерировать и скачать QR-коды"},{"type":"images","files":["marketing-qr-01.png"]},{"type":"step","marker":"3","level":0,"text":"Скачайте и распечатайте сгенерированные коды"},{"type":"p","text":"В QR зашифрованы коды товаров."}]},{"id":"marketing-max","title":"Как подключить уведомления в MAX","blocks":[{"type":"step","marker":"1","level":0,"text":"Создайте группу в MAX"},{"type":"p","text":"Создайте отдельную группу для уведомлений о заказах. Например, назовите её «Новые заказы»."},{"type":"step","marker":"2","level":0,"text":"Добавьте сотрудников"},{"type":"p","text":"Добавьте в группу менеджеров и других сотрудников, которые должны получать уведомления о новых заказах."},{"type":"step","marker":"3","level":0,"text":"Отправьте нам ID группы"},{"type":"step","marker":"1","level":0,"text":"Откройте веб-версию MAX."},{"type":"link","text":"Открыть ссылку","url":"https://web.max.ru/"},{"type":"step","marker":"2","level":0,"text":"Перейдите в созданную группу."},{"type":"step","marker":"3","level":0,"text":"Скопируйте ссылку на группу из адресной строки браузера."},{"type":"step","marker":"4","level":0,"text":"Отправьте эту ссылку нам — в ней содержится ID группы, необходимый для подключения уведомлений."},{"type":"step","marker":"4","level":0,"text":"Подключите бота Sobri"},{"type":"p","text":"Перейдите по ссылке https://max.ru/id561209981366_bot и подключите бота."},{"type":"link","text":"Открыть ссылку","url":"https://max.ru/id561209981366_bot"},{"type":"step","marker":"5","level":0,"text":"Добавьте бота в группу"},{"type":"step","marker":"1","level":0,"text":"Откройте созданную группу."},{"type":"step","marker":"2","level":0,"text":"Перейдите в настройки группы."},{"type":"step","marker":"3","level":0,"text":"Нажмите «Добавить участника»."},{"type":"step","marker":"4","level":0,"text":"В поле поиска введите Sobri."},{"type":"step","marker":"5","level":0,"text":"Выберите бота Sobri и добавьте его в группу."},{"type":"p","text":"Готово! После настройки бот Sobri будет присылать в группу уведомления о новых заказах."}]}]},{"id":"settings","title":"Настройки","icon":"settings","description":"Группы пользователей и системные настройки","articles":[{"id":"settings-groups","title":"Группы пользователей","blocks":[{"type":"p","text":"Группы пользователей работают как уровни доступа: позволяют задавать разные права для разных пользователей."},{"type":"bullet","level":0,"text":"Группы покупателей определяют доступ к товарам и категориям, а также способам доставки оплаты и видам цен, скидки и промо-акции, бонусы. Для разных групп покупателей можно задать разную цену на один и тот же товар."},{"type":"p","text":"Управлять группами можно на странице Покупатели или Покупатели → Группы пользователей."},{"type":"h2","text":"Создание группы"},{"type":"step","marker":"1","level":0,"text":"Откройте страницу Покупатели → Группы пользователей в панели администратора."},{"type":"step","marker":"2","level":0,"text":"Нажмите кнопку + Добавить группу. Откроется форма создания группы."},{"type":"step","marker":"3","level":0,"text":"Заполните поля формы."},{"type":"bullet","level":1,"text":"Группа — название группы."},{"type":"bullet","level":2,"text":"Вкл. — группа работает. Если это группа покупателей, то она видна на витрине, и покупатели могут подать запрос на вступление в группу."},{"type":"bullet","level":2,"text":"Скрыта — группа работает, но не видна на витрине (поэтому покупатели не могут оставить запрос на вступление в группу)."},{"type":"bullet","level":2,"text":"Выкл. — группа нигде не появляется и никак не влияет на права пользователей."},{"type":"step","marker":"4","level":0,"text":"Нажмите кнопку Сохранить. Новая группа появится в списке."},{"type":"p","text":"Для привязки группе к Вид цен 1с потребуется ID созданной группы, для его получения свяжитесь администратором Платформы."}]}]}]};

function routeLink(sec,id,label){
  return `<a class="internal-link" href="#article/${sec}/${id}">${esc(label)}</a>`;
}
function addKnownArticleLinks(text){
  let s=esc(text).replace(/\n/g,"<br>");
  Object.entries(INTERNAL_LINKS).forEach(([label,target])=>{
    const safe=esc(label).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    s=s.replace(new RegExp(safe,"gi"),m=>routeLink(target[0],target[1],m));
  });
  return s;
}

function plural(n){const a=n%10,b=n%100;if(a===1&&b!==11)return"инструкция";if(a>=2&&a<=4&&!(b>=12&&b<=14))return"инструкции";return"инструкций"}

function flattenArticleText(article){const parts=[article.title||""];(article.blocks||[]).forEach(b=>{if(b.text)parts.push(b.text);if(b.rows)b.rows.forEach(r=>r.forEach(c=>parts.push(c||"")))});return parts.join(" ")}
function normalizeSearch(s){return String(s||"").toLowerCase().replace(/ё/g,"е").replace(/[^\p{L}\p{N}]+/gu," ").replace(/\s+/g," ").trim()}
const SEARCH_STOP=new Set(["и","в","во","на","по","из","для","как","с","со","к","ко","у","от","до","за","при","или","а","но","это","этот","эта"]);
function queryTokens(q){return normalizeSearch(q).split(" ").filter(x=>x.length>1&&!SEARCH_STOP.has(x))}
function levenshtein(a,b){if(a===b)return 0;if(!a.length)return b.length;if(!b.length)return a.length;const prev=Array.from({length:b.length+1},(_,i)=>i),cur=new Array(b.length+1);for(let i=1;i<=a.length;i++){cur[0]=i;for(let j=1;j<=b.length;j++)cur[j]=Math.min(cur[j-1]+1,prev[j]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));for(let j=0;j<=b.length;j++)prev[j]=cur[j]}return prev[b.length]}
function fuzzyWordScore(qt,words){if(qt.length<4)return 0;let best=0;for(const w of words){if(w===qt)return 1;if(w.startsWith(qt)||qt.startsWith(w))best=Math.max(best,.92);else if(Math.abs(w.length-qt.length)<=2){const d=levenshtein(qt,w),sim=1-d/Math.max(qt.length,w.length);if(sim>best)best=sim}}return best}
const SEARCH_EXTRAS={"1c-nomenclature":"Все товары которые должны представлены в приложении необходимо собрать в одну папку, внутри этой папки могут несколько подкатегории. Товары неактуальные, снятые с продажи, заархивированные нужно перенести в отдельную папку Услуги – номенклатуры которые не имеет остатка на складах но участвуют в заказе покупателя, нужно разделить в отдельную папку. К примеру: доп вырезы про-во, конструкции, доп углы, доставка и т.д У дилеров должно быть правильно заполнен формат номер телефона как на скрине.","1c-orders":"Как отличать заказы созданные онлайн от созданных менеджерами. Новые созданные онлайн заказы приобретают статус “Загружен с сайта”. Взяв за основу этот статус мы можем менять цвета фонов и текстов в списке заказав, чтобы их выделить и отличать от созданных менеджерами. Для этого проведите настройки описанные на слайде 2,3 и 4 красный текст номера заказа и даты для всех онлайн заказов желтый фон - если статус Загружен с сайта 1 Откройте Настроить список Во вкладке условное оформление Для того чтобы фон онлайн заказов в списке заказов выделялся желтым цветом 1. В столбце оформление выберите цвет фона 2. В столбце Условия установите текущий статус - ровно - Загружен с сайта 3. В столбце Оформляемые поля выберите Все поля 3 Для того чтобы текст онлайн заказов в списке заказов выделялся красным цветом 1. В столбце оформление выберите цвет текста 2. В столбце Условия установите Источник заказа - Наименование - Содержит - пропишите Загружен 3. В столбце Оформляемые поля выберите Дата, Сайт ID 3 Во вкладке условное оформление Для того чтобы фон онлайн заказов со статусом “Собран” в списке заказов выделялся красным цветом 1. В столбце оформление выберите цвет фона 2. В столбце Условия установите текущий статус - ровно - Загружен с сайта 3. В столбце Оформляемые поля выберите Все поля Как скопировать настроенный список заказов для других пользователей Перейдите в настройку пользователя на которого делали настройки Настройки – Пользователи – Настройки. В списке найдите заказ покупателя или Рабочее место менеджера пользователя, Нажмите правой кнопкой мыши выберите Скопировать другим, и выберите пользователей на которого хотите скопировать. P.S пользователям копируется расположения и все другие настройки полей, необходимо настроить все поля так чтоб всем было удобно."};
const SEARCH_INDEX=[];
DATA.sections.forEach(sec=>sec.articles.forEach(a=>{
  const visibleBody=flattenArticleText(a);
  const body=[visibleBody,SEARCH_EXTRAS[a.id]||""].filter(Boolean).join(" ");
  const titleNorm=normalizeSearch(a.title),sectionNorm=normalizeSearch(sec.title),bodyNorm=normalizeSearch(body);
  SEARCH_INDEX.push({sec,a,body,titleNorm,sectionNorm,bodyNorm,titleWords:titleNorm.split(" ").filter(Boolean),sectionWords:sectionNorm.split(" ").filter(Boolean)})
}));
function searchScore(query,item){
  const q=normalizeSearch(query),tokens=queryTokens(query);
  if(!q)return 0;
  let score=0;
  if(item.titleNorm===q)score=Math.max(score,220);
  else if(item.titleNorm.includes(q))score=Math.max(score,180);
  else if(q.length>=4&&item.titleNorm.split(" ").some(w=>w.startsWith(q)))score=Math.max(score,145);
  if(item.sectionNorm===q)score=Math.max(score,125);
  else if(item.sectionNorm.includes(q))score=Math.max(score,105);
  if(item.bodyNorm.includes(q))score=Math.max(score,115);

  if(tokens.length){
    const titleHits=tokens.filter(t=>item.titleNorm.includes(t)).length;
    const bodyHits=tokens.filter(t=>item.bodyNorm.includes(t)).length;
    if(titleHits===tokens.length)score=Math.max(score,155+tokens.length*4);
    else if(titleHits)score=Math.max(score,70+55*(titleHits/tokens.length));
    if(bodyHits===tokens.length)score=Math.max(score,100+tokens.length*3);
    else if(bodyHits)score=Math.max(score,35+45*(bodyHits/tokens.length));

    if(score<90){
      let fuzzy=0,matched=0;
      for(const t of tokens){
        const sim=Math.max(fuzzyWordScore(t,item.titleWords),fuzzyWordScore(t,item.sectionWords));
        if(sim>=.72){fuzzy+=sim;matched++}
      }
      if(matched===tokens.length)score=Math.max(score,65+35*(fuzzy/tokens.length));
      else if(matched)score=Math.max(score,35+25*(matched/tokens.length));
    }
  }
  return score;
}
function makeSnippet(text,query){
  const raw=String(text||"").replace(/\s+/g," ").trim();if(!raw)return "";
  const tokens=queryTokens(query);const rawLow=raw.toLowerCase().replace(/ё/g,"е");
  let pos=-1;for(const token of tokens){pos=rawLow.indexOf(token);if(pos>=0)break}
  if(pos<0)return raw.slice(0,150)+(raw.length>150?"…":"");
  const start=Math.max(0,pos-60),end=Math.min(raw.length,pos+130);
  return(start>0?"…":"")+raw.slice(start,end)+(end<raw.length?"…":"");
}
function performSearch(q){
  const found=SEARCH_INDEX.map(item=>({...item,score:searchScore(q,item)}))
    .filter(x=>x.score>=60)
    .sort((a,b)=>b.score-a.score || a.a.title.localeCompare(b.a.title,"ru"))
    .slice(0,8);
  searchResults.innerHTML=found.length?found.map(x=>`
    <div class="search-result" onclick="openArticle('${x.sec.id}','${x.a.id}');searchResults.style.display='none';searchInput.value=''">
      <div class="search-result-main"><b>${esc(x.a.title)}</b><small>${esc(x.sec.title)}</small></div>
      <div class="search-open">↗</div>
      <div class="search-snippet">${esc(makeSnippet(x.body,q))}</div>
    </div>`).join(""):`<div class="search-result"><div class="search-result-main"><b>Ничего не найдено</b><small>Попробуйте другой запрос</small></div></div>`;
  searchResults.style.display="block";
}

function renderBlocks(blocks,secId,articleId){return(blocks||[]).map((b,i)=>{if(b.type==="h2")return`<h2 id="h${i}">${contextualLink(b.text,secId,articleId)}</h2>`;if(b.type==="h3")return`<h3 id="h${i}">${contextualLink(b.text,secId,articleId)}</h3>`;if(b.type==="p")return`<p>${contextualLink(b.text,secId,articleId)}</p>`;if(b.type==="step")return`<div class="step level${b.level||0}"><div class="step-marker">${esc(b.marker)}</div><div>${contextualLink(b.text,secId,articleId)}</div></div>`;if(b.type==="bullet")return`<div class="bullet level${b.level||0}">${contextualLink(b.text,secId,articleId)}</div>`;if(b.type==="warning")return`<div class="warning-inline">${contextualLink(b.text,secId,articleId)}</div>`;if(b.type==="note")return`<div class="note">${contextualLink(b.text,secId,articleId)}</div>`;if(b.type==="link"){const local=internalTargetForUrl(b.url);if(local){if(local.sec===secId&&local.id===articleId)return"";return`<a class="video-link" href="#article/${local.sec}/${local.id}">${icon("arrow")} ${esc(local.label)}</a>`}const isVideo=/видео/i.test(b.text)||/drive\.google\.com/i.test(b.url);return`<a class="video-link" href="${esc(b.url)}" target="_blank" rel="noopener">${icon(isVideo?"play":"arrow")} ${esc(b.text)}</a>`;}if(b.type==="images")return`<div class="shots ${b.files.length===2?"two":""}">${b.files.map(f=>`<div class="shot" onclick="openImg('images/${esc(f)}')"><img loading="lazy" src="images/${esc(f)}" alt=""></div>`).join("")}</div>`;if(b.type==="table"){const r=b.rows||[];if(!r.length)return"";return`<div class="table-wrap"><table class="doc-table"><thead><tr>${r[0].map(c=>`<th>${contextualLink(c,secId,articleId)}</th>`).join("")}</tr></thead><tbody>${r.slice(1).map(x=>`<tr>${x.map(c=>`<td>${contextualLink(c,secId,articleId)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}return""}).join("")}

function scrollToHeading(id){const el=document.getElementById(id);if(el)el.scrollIntoView({behavior:"smooth",block:"start"})}
function articleBottomNav(sec,a){const idx=sec.articles.findIndex(x=>x.id===a.id),prev=idx>0?sec.articles[idx-1]:null,next=idx>=0&&idx<sec.articles.length-1?sec.articles[idx+1]:null;const card=(item,type)=>item?`<div class="article-nav-link ${type}" onclick="openArticle('${sec.id}','${item.id}')"><div class="article-nav-label">${type==="prev"?"← Предыдущая инструкция":"Следующая инструкция →"}</div><div class="article-nav-title">${esc(item.title)}</div></div>`:`<div class="article-nav-link ${type} empty"></div>`;return `<nav class="article-bottom-nav">${card(prev,"prev")}${card(next,"next")}</nav>`}
