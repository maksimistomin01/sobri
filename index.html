/* --- Theme system refinements --- */
:root{
  --surface-soft:#f7f9fc;
  --surface-hover:#f1f6fb;
  --surface-strong:#ffffff;
  --border-strong:#d9e1eb;
  --text-soft:#41506a;
  --accent-soft:#e8f5ff;
  --scroll-thumb:#c8d2df;
}
.theme-btn{
  width:auto!important; min-width:142px; padding:0 14px!important;
  display:inline-flex!important; align-items:center; justify-content:center; gap:9px;
  font-size:13px; font-weight:700; white-space:nowrap;
  background:var(--surface-strong)!important; color:var(--text-soft)!important;
  border-color:var(--line)!important;
}
.theme-btn:hover{background:var(--surface-hover)!important}
.theme-icon{width:18px;height:18px;display:inline-grid;place-items:center}
.theme-icon svg{width:18px;height:18px}
.theme-label{line-height:1}

.search-results{
  background:var(--surface-strong)!important;
  border-color:var(--line)!important;
  color:var(--text)!important;
  scrollbar-color:var(--scroll-thumb) transparent;
}
.search-result{color:var(--text)!important}
.search-result:hover{background:var(--surface-hover)!important}
.search-result b{color:var(--text)!important}
.search-result small{color:var(--muted)!important}
.search-results::-webkit-scrollbar{width:10px}
.search-results::-webkit-scrollbar-track{background:transparent}
.search-results::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:999px;border:2px solid transparent;background-clip:padding-box}

.help{
  background:linear-gradient(145deg,var(--surface-soft),var(--surface-strong))!important;
  border-color:var(--line)!important;
}
.help strong{color:var(--text)!important}
.help p{color:var(--muted)!important}
.float-card{
  background:var(--surface-strong)!important;
  border-color:var(--line)!important;
  color:var(--text)!important;
}
.float-card strong{color:var(--text)!important}
.float-card small{color:var(--muted)!important}
.card,.section-banner,.article-list,.article,.toc,.video-page,.back,.doc-table{
  background:var(--surface-strong);
}
.article-row:hover{background:var(--surface-hover)!important}
.doc-icon{background:var(--accent-soft)!important}
.nav-btn{color:var(--text-soft)!important}
.nav-btn:hover,.nav-btn.active{color:#0a8fe1!important}
.back{color:var(--text)!important}
.crumbs,.card-meta{color:var(--muted)!important}
.internal-link{
  color:#0a8fe1;
  font-weight:700;
  text-decoration:none;
  border-bottom:1px solid rgba(10,143,225,.28);
}
.internal-link:hover{border-bottom-color:#0a8fe1}
.theme-crosslink{
  margin-top:10px;
  display:inline-flex; align-items:center; gap:7px;
  color:#0a8fe1; font-size:14px; font-weight:700;
}

/* --- Navigation/search enhancements --- */
.mobile-menu-btn{display:none;width:44px;height:44px;flex:0 0 auto;border:1px solid var(--line);border-radius:13px;background:var(--surface-strong);color:var(--text-soft);cursor:pointer;align-items:center;justify-content:center}

.sidebar-overlay{display:none;position:fixed;inset:0;z-index:89;background:rgba(6,10,18,.46);backdrop-filter:blur(2px)}
.search-result{display:grid!important;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:start}
.search-result-main{min-width:0}.search-snippet{grid-column:1/-1;margin-top:4px;color:var(--muted);font-size:12px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.search-open{font-size:11px;color:var(--muted);padding-top:2px}

.article-nav-link:hover{transform:translateY(-1px);border-color:var(--border-strong);background:var(--surface-hover)}
.article-nav-link.next{text-align:right;align-items:flex-end}.article-nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:5px}.article-nav-title{font-size:13px;line-height:1.4;color:var(--text);font-weight:750}.article-nav-link.empty{visibility:hidden;pointer-events:none}

<script>
const DATA={"sections":[{"id":"categories","title":"Категории","icon":"categories","description":"Категории товаров и порядок отображения","articles":[{"id":"categories-multi","title":"Как отображать один и тот же товар в нескольких категориях","blocks":[{"type":"h2","text":"Как отображать один и тот же товар в нескольких категориях"},{"type":"step","marker":"1","level":0,"text":"Откройте страницу Товары → Товары в панели администратора."},{"type":"step","marker":"2","level":0,"text":"Нажмите на название товара, который вы хотите добавить ещё в одну категорию."},{"type":"step","marker":"3","level":0,"text":"Откроется страница редактирования товара. Нажмите кнопку Добавить категории."},{"type":"step","marker":"4","level":0,"text":"Во всплывающем окне отметьте галочками категории, куда нужно добавить товар, и нажмите кнопку Добавить категории и закрыть."},{"type":"step","marker":"5","level":0,"text":"Нажмите кнопку Сохранить и закрыть."},{"type":"images","files":["categories-multi-01.png"]}]},{"id":"categories-sort","title":"Как сортировать товары в категории по позиции","blocks":[{"type":"p","text":"По умолчанию товары в категориях сортируются по алфавиту. Вы можете изменить порядок, в котором товары выводятся в категории. Для этого потребуется указать позиции товаров."},{"type":"step","marker":"1","level":0,"text":"Откройте страницу Товары → Категории в панели администратора."},{"type":"step","marker":"2","level":0,"text":"У каждой категории есть колонка Товары, где указано количество товаров в этой категории. Нажмите на это количество у категории, в которой вам нужно отсортировать товары."},{"type":"images","files":["categories-sort-01.png"]},{"type":"step","marker":"3","level":0,"text":"Откроется новая страница со списком товаров. Укажите позиции товаров."},{"type":"images","files":["categories-sort-02.png"]},{"type":"step","marker":"4","level":0,"text":"Нажмите кнопку Сохранить в правой верхней части страницы."},{"type":"p","text":"Позиции повлияют на порядок товаров только если будет выбран один из видов сортировки по позиции."},{"type":"p","text":"Можно сделать Сортировать по позиции: низкие позиции выше или Сортировать по позиции: высокие позиции ниже способом сортировки по умолчанию. Для этого на странице Настройки → Внешний вид выберите этот способ сортировки в выпадающем списке Сортировка списка товаров по умолчанию. Перед этим убедитесь, что для этого способа сортировки стоит галочка в настройке Доступные способы сортировки списка товаров."}]}]},{"id":"product","title":"Товар","icon":"package","description":"Карточки товаров, свойства, цены, остатки и вариации","warning":"Нельзя на сайте удалять товар, выгруженный из 1С. Если товар уже не актуален, его нужно выключить или скрыть.","articles":[{"id":"product-start","title":"Начало настройки","external":"https://drive.google.com/file/d/1FLERbaROUEyLV38CpHIhoMw1jhUmKude/view","embed":"https://drive.google.com/file/d/1FLERbaROUEyLV38CpHIhoMw1jhUmKude/preview","video":true},{"id":"product-mass-edit","title":"Массовое редактирование товаров","blocks":[{"type":"p","text":"Видео 1"},{"type":"link","text":"Видео","url":"https://drive.google.com/file/d/1LOrtf40MiKTg6zMSR1-vgwPOsh50Sf1t/view?usp=drive_link"},{"type":"p","text":"Видео 2"},{"type":"link","text":"Видео","url":"https://drive.google.com/file/d/1cSGAZNbl0ILW_u2umBfqcp0URR40zcFW/view?usp=drive_link"},{"type":"h2","text":"Вы можете отредактировать свойства сразу у нескольких товаров."},{"type":"step","marker":"1","level":0,"text":"Откройте в панели администратора магазина страницу Товары → Товары."},{"type":"step","marker":"2","level":0,"text":"Нажмите на товары, которые необходимо дублировать (клонировать)."},{"type":"step","marker":"3","level":0,"text":"Нажмите кнопку Редактировать выбранные над списком товаров."},{"type":"images","files":["product-mass-edit-01.png"]},{"type":"step","marker":"4","level":0,"text":"Во всплывающем окне отметьте галочками свойства, которые хотите отредактировать у выбранных товаров. Затем нажмите кнопку Редактировать выбранные.\nНе выбирайте много настроек одновременно, иначе их будет неудобно редактировать."},{"type":"images","files":["product-mass-edit-02.png"]},{"type":"step","marker":"5","level":0,"text":"Выбранные товары и их свойства будут доступны на одной странице. Отредактируйте их, а затем нажмите кнопку Сохранить в правой верхней части страницы.\nЧтобы применить одно значение свойства сразу ко всем выбранным товарам, воспользуйтесь ссылкой Применить значения к выделенным товарам."},{"type":"images","files":["product-mass-edit-03.png"]},{"type":"h2","text":"Общее обновление"},{"type":"p","text":"В CS-Cart есть специальная страница, где можно обновить некоторые свойства у всех товаров разом. Например, можно увеличить цену всех товаров на 10% или поднять рекомендованную цену, чтобы рядом со всеми товарами появилась информация о скидке."},{"type":"h2","text":"Чтобы обновить все товары разом:"},{"type":"step","marker":"1","level":0,"text":"Откройте страницу Товары → Товары в панели администратора."},{"type":"step","marker":"2","level":0,"text":"Нажмите на кнопку с изображением шестерёнки в правой верхней части страницы и выберите Редактировать все."},{"type":"images","files":["product-mass-edit-04.png"]},{"type":"step","marker":"3","level":0,"text":"Откроется новая страница. На ней можно глобально обновить следующие свойства товаров:"},{"type":"bullet","level":1,"text":"Цена"},{"type":"bullet","level":1,"text":"Рекомендованная цена"},{"type":"bullet","level":1,"text":"В наличии (количество товаров в наличии)"},{"type":"bullet","level":1,"text":"Цена в баллах"},{"type":"step","marker":"4","level":0,"text":"По умолчанию, эти свойства обновятся у всех товаров. Но если воспользоваться кнопкой Добавить товары, то можно выбрать конкретные товары, которые нужно обновить."},{"type":"step","marker":"5","level":0,"text":"Укажите, как именно обновить свойства товаров, и нажмите Применить."},{"type":"images","files":["product-mass-edit-05.png"]}]},{"id":"product-properties","title":"Свойства товаров (поля и настройки)","blocks":[{"type":"p","text":"При создании или редактировании товара можно указать много разных свойств. Для удобства они распределены по вкладкам на странице редактирования товара."},{"type":"h3","text":"Информация"},{"type":"bullet","level":0,"text":"Название — название товара, которое отобразится на витрине и в панели администратора. Может быть разным для разных языков и витрин."},{"type":"bullet","level":0,"text":"Категории — категории, к которым относится товар. Если у товара несколько категорий, то основной будет та, которая находится первой в списке. Чтобы изменить основную категорию, просто перетащите на её место другую."},{"type":"bullet","level":0,"text":"Цена — цена товара в базовой валюте магазина. Цены для других валют конвертируются по заданному курсу. Все расчёты магазина выполняются в основной валюте."},{"type":"bullet","level":0,"text":"Подробное описание — описание товара, которое появится на витрине на странице товара. Можно просто ввести текст или использовать HTML для форматирования. Если вы не знакомы с HTML, вы все равно сможете отформатировать текст с помощью визуального редактора: вы правите текст как в редакторе документов, а HTML-код добавляется автоматически."},{"type":"bullet","level":0,"text":"Статус — статус товара:"},{"type":"bullet","level":1,"text":"Вкл. — товар доступен на витрине и появляется в списке товаров."},{"type":"bullet","level":1,"text":"Выкл. — товар нельзя посмотреть на витрине и приобрести."},{"type":"bullet","level":1,"text":"Скрыто — товар не появляется в списке товаров на витрине, но доступен для покупателей по прямой ссылке."},{"type":"bullet","level":0,"text":"Изображения — изображения товара. Поддерживаемые форматы: JPEG, GIF, PNG. Максимальный вес изображения зависит от настроек сервера; как правило, изображение должно весить не больше 1 мегабайт. Иконки будут созданы из изображений автоматически.\nОдно из загруженных изображений будет больше, чем все остальные. Это главное изображение товара, и оно отображается на списке товаров и на детальной странице товара по умолчанию. Чтобы изменить главное изображение, просто перетащите другое изображение на его место. Таким же образом можно менять порядок дополнительных изображений.\nПри наведении на изображение вы сможете просмотреть его в полном размере, удалить его, или отредактировать alt-текст (описание изображение, которое появляется, если само изображение по каким-то причинам не отображается). Описания изображений нужны, чтобы оптимизировать сайт для поисковых систем (SEO)."},{"type":"h3","text":"Настройки опций"},{"type":"p","text":"Следующие поля появляются, если на странице Настройки → Общие разрешено менять значение данной настройки на уровне отдельных объектов."},{"type":"bullet","level":0,"text":"Тип опций — порядок выбора вариантов у опций товара:"},{"type":"bullet","level":1,"text":"Одновременно — покупатели смогут выбрать варианты для разных опций независимо друг от друга и в любом порядке."},{"type":"bullet","level":1,"text":"Последовательно — покупатели выбирают варианты для каждой опции пошагово: сначала вариант первой опции, затем второй, и т.д."},{"type":"bullet","level":0,"text":"Опции — это определённые свойства товара, которые покупатель выбирает при покупке. Например, для одежды опциями могут быть цвет и размер. Вариантами таких опций могут быть красный/зелёный/синий и /M/L/XL/XXL соответственно."},{"type":"bullet","level":0,"text":"Тип исключений — выберите тип исключений:"},{"type":"bullet","level":1,"text":"Разрешение — на вкладке Опции вы сможете задать Разрешённые комбинации. Тогда покупатели смогут купить товар, только если комбинация вариантов опций находится в списке разрешённых."},{"type":"bullet","level":1,"text":"Запрещение — на вкладке Опции вы сможете задать Запрещённые комбинации. Тогда покупатели смогут купить товар, только если комбинация вариантов опций не находится в списке запрещённых."},{"type":"h3","text":"Ценообразование / Склад"},{"type":"bullet","level":0,"text":"КОД — идентификатор товарной позиции в вашем магазине (SKU); по коду при импорте определяется, к какому именно товару относится строка с данными."},{"type":"bullet","level":0,"text":"Рекомендованная цена — если значение здесь выше, чем в поле Цена, то у товара на витрине появится отметка о скидке."},{"type":"bullet","level":0,"text":"В наличии — количество товара на складе. Товар, который закончился на складе, нельзя купить, если только на странице Настройки → Общие → Каталог не стоит галочка Разрешить отрицательное количество товаров на складе."},{"type":"bullet","level":0,"text":"Налоги — выберите налоги, которые будут применены к товару."},{"type":"p","text":"Следующие поля появляются, если на странице Настройки → Оформление заказа разрешено менять значение данной настройки на уровне отдельных объектов. Поле Отслеживать количество включается для отдельных объектов на странице Настройки → Общие."},{"type":"bullet","level":0,"text":"Действие при нулевой цене — определяет, что можно сделать на витрине, если цена товара равна 0:"},{"type":"bullet","level":1,"text":"Не разрешать добавлять товар в корзину"},{"type":"bullet","level":1,"text":"Разрешить добавлять товар в корзину"},{"type":"bullet","level":1,"text":"Попросить покупателя ввести цену — вместо цены будет отображено поле для ввода. Покупатель сможет предложить свою цену. Можно использовать для благотворительных акций и сборов."},{"type":"bullet","level":0,"text":"Отслеживать количество — определяет, будет ли уменьшаться количество товара на складе после его покупки."},{"type":"bullet","level":0,"text":"Минимальное количество для покупки одного продукта — минимальное количество экземпляров товара, которые пользователь может приобрести за 1 раз. Эта информация отображается на странице товара, сразу после цены."},{"type":"bullet","level":0,"text":"Максимальное количество для покупки одного продукта — максимальное количество экземпляров товара, которые пользователь может приобрести за 1 раз. 0 означает отсутствие ограничений."},{"type":"bullet","level":0,"text":"Шаг списка выбора количества — количество экземпляров товара, которые пользователь может добавить в корзину или убрать из неё за 1 раз.\nЕсли минимальный заказ равен 3, максимальный заказ равен 9, а шаг выбора равен 3, то покупатель сможет оформить заказ на 3, 6 или 9 товаров."},{"type":"bullet","level":0,"text":"Доступное количество — ограничение на количество вариантов в выпадающем списке выбора количества товара. Это полезно, когда задан шаг выбора количества, а на складе очень много экземпляров товара."},{"type":"h3","text":"Доступность"},{"type":"bullet","level":0,"text":"Группы пользователей — группы пользователей, для которых доступен этот товар."},{"type":"bullet","level":0,"text":"Дата создания — дата, когда товар был добавлен в каталог. Используется в сортировке товаров по времени."},{"type":"bullet","level":0,"text":"Доступен с — дата, с которой товар можно будет купить. Полезно, если товар ожидает поступления, или если вы хотите начать продажи в какой-то определённый день."},{"type":"bullet","level":0,"text":"Действие при отсутствии товаров на складе — выберите, должна ли у покупателя быть возможность приобрести товар заранее или подписаться на уведомление по электронной почте о том, что товар доступен.\nПодробнее читайте в статье о действиях при отсутствии товара в наличии."},{"type":"h3","text":"Подробнее"},{"type":"bullet","level":0,"text":"Отображение карточки товара — выберите шаблон (внешний вид) страницы товара. По умолчанию доступно 2 шаблона, но вы можете разработать свои собственные шаблоны под ваши нужды."},{"type":"bullet","level":0,"text":"Следующие настройки появляются, если на странице Настройки → Общие → Каталог поставлена галочка Включить продажу цифровых товаров:"},{"type":"bullet","level":1,"text":"Цифровой товар — если поставить галочку, то товар будет считаться цифровым."},{"type":"bullet","level":1,"text":"Рассчитать стоимость доставки для электронного товара как для обычного — если поставить галочку, то стоимость доставки для этого цифрового товара будет рассчитываться, как для обычного."},{"type":"bullet","level":1,"text":"Не ограниченная по времени загрузка — если поставить галочку, то период загрузки товара никогда не заканчивается.\nКак правило, купленный цифровой товар можно скачать в течение определенного времени. Это время задается в настройке Период доступности ключа для скачивания цифровых товаров в часах на странице Настройки → Общие."},{"type":"bullet","level":0,"text":"Краткое описание — краткое описание товара; это описание появляется в списке товаров. Если оставить это поле пустым, то краткое описание создастся из полного автоматически (первые 300 символов)."},{"type":"bullet","level":0,"text":"Популярность — целое число, которое обозначает популярность товара. Популярность вычисляется автоматически и зависит от того, сколько раз товар посмотрели на витрине, добавили в корзину и приобрели. На витрине товары можно сортировать по популярности."},{"type":"bullet","level":0,"text":"Ключевые слова для поиска — список слов, по которым встроенный поиск в магазине должен находить этот товар."},{"type":"bullet","level":0,"text":"Промо-текст — дополнительный блок с информацией; отображается в правом верхнем углу на странице товара."},{"type":"h2","text":"Опции"},{"type":"p","text":"На этой вкладке можно управлять опциями, их вариантами и комбинациями опций (в том числе запрещёнными и разрешёнными)."},{"type":"images","files":["product-properties-01.png"]},{"type":"p","text":"Опции появляются на странице товара на витрине. В зависимости от типа опции, покупатели либо выбирают один из вариантов, либо вводят своё значение. Свойства опций описаны в отдельной статье."},{"type":"h2","text":"Вариации"},{"type":"p","text":"На этой вкладке вы можете создавать похожие товары и добавлять их в группу."},{"type":"bullet","level":0,"text":"Добавить вариации — создайте вариации, автоматически на основе характеристик или с использованием существующих товаров."},{"type":"bullet","level":0,"text":"Добавить в группу вариаций — добавьте этот товар как вариацию в существующую группу."},{"type":"h2","text":"Параметры доставки"},{"type":"p","text":"Свойства товара с этой вкладки используются при автоматическом расчёте стоимости доставки."},{"type":"bullet","level":0,"text":"Вес — вес одного экземпляра товара в стандартной единице веса. Стандартная единица веса задаётся на странице Настройки → Общие."},{"type":"bullet","level":0,"text":"Бесплатная доставка — если поставить галочку, то товар не будет учитываться при расчёте стоимости доставки, но только если у выбранного способа доставки стоит галочка Использовать для бесплатной доставки."},{"type":"bullet","level":0,"text":"Стоимость доставки — дополнительный сбор (например, за страховку, упаковку и пр.), который будет прибавлена к общей стоимости доставки."},{"type":"bullet","level":0,"text":"Количество штук в коробке — минимальное и максимальное значение, если товары доставляются по несколько штук в одной упаковке. Обычно подходит значение 1 - 1 (только один товар в коробке)."},{"type":"bullet","level":0,"text":"Длина коробки — длина одной коробки."},{"type":"bullet","level":0,"text":"Ширина коробки — ширина одной коробки."},{"type":"bullet","level":0,"text":"Высота коробки — высота одной коробки."},{"type":"p","text":"Если вы не введёте информацию о размерах коробок здесь, то она будет браться из настроек способа доставки. Эта информация нужна для более точного расчёта стоимости доставки, когда способ доставки поддерживает отправку нескольких коробок (UPS, FedEx, DHL)."},{"type":"h2","text":"Оптовые скидки"},{"type":"p","text":"На этой вкладке задаются оптовые скидки на товар в зависимости от количества штук в корзине. Покупатели увидят эти скидки на странице товара на витрине."},{"type":"link","text":"оптовые скидки","url":"https://www.cs-cart.ru/docs/latest/user_guide/manage_products/products/wholesale.html"},{"type":"images","files":["product-properties-02.png"]},{"type":"p","text":"У каждой оптовой скидки есть свой набор свойств:"},{"type":"bullet","level":0,"text":"Кол-во — минимальное количество экземпляров товара, которое должно быть в корзине, чтобы покупатель получил оптовую скидку."},{"type":"bullet","level":0,"text":"Значение — значение скидки (на каждый экземпляр товара)."},{"type":"bullet","level":0,"text":"Тип — тип скидки:"},{"type":"bullet","level":1,"text":"Фиксированная — стоимость одного товара со скидкой."},{"type":"bullet","level":1,"text":"В процентах — размер скидки на каждый экземпляр товара в процентах."},{"type":"bullet","level":0,"text":"Группа — группа пользователей, которая может воспользоваться скидкой.\nЕсли скидка действительна для всех групп пользователей и требует покупки только 1 экземпляра товара, эта скидка перезапишет цену товара."},{"type":"link","text":"группа пользователей","url":"https://www.cs-cart.ru/docs/latest/user_guide/users/user_groups/index.html"},{"type":"images","files":["product-properties-03.png"]},{"type":"h2","text":"Продаваемые файлы"},{"type":"p","text":"Размещайте файлы и дистрибутивы для цифровых товаров. Эти файлы будут доступны покупателю после покупки товара."},{"type":"p","text":"Для цифровых инструкций и/или файлов, которые идут с товаром, но не продаются, рекомендуем использовать другую вкладку — Прикреплённые файлы."},{"type":"images","files":["product-properties-04.png"]},{"type":"p","text":"У каждого файла есть следующие свойства:"},{"type":"bullet","level":0,"text":"Название — название файла, которые покупатели увидят на странице товара. Это название не изменит физическое название самого файла."},{"type":"bullet","level":0,"text":"Позиция — положение файла относительно других файлов в списке."},{"type":"bullet","level":0,"text":"Папка — папка, к которой относится файл (если вы добавили папки)."},{"type":"bullet","level":0,"text":"Файл — сам файл, который можно будет скачать после покупки."},{"type":"bullet","level":0,"text":"Предпросмотр — файл предпросмотра, который можно свободно скачать на странице товара на витрине."},{"type":"bullet","level":0,"text":"Режим активации — определяет, как будет активирована ссылка на скачивание:"},{"type":"bullet","level":1,"text":"Немедленно — сразу после того, как покупатель сделает заказ."},{"type":"bullet","level":1,"text":"После полной оплаты — после того, как статус заказа изменится на Обработан или Выполнен."},{"type":"bullet","level":1,"text":"Вручную — ссылку активирует администратор вручную."},{"type":"bullet","level":0,"text":"Макс. количество загрузок — определяет, сколько раз один и тот же покупатель может скачать файл."},{"type":"bullet","level":0,"text":"Лицензионное соглашение — текст лицензионного соглашения."},{"type":"bullet","level":0,"text":"Требуется соглашение — определяет, должен ли покупатель принять лицензионное соглашение на странице оформления заказа."},{"type":"bullet","level":0,"text":"Текст для ознакомления — дополнительные инструкции (например, инструкции по установке и т.п.)"},{"type":"h2","text":"Подписчики"},{"type":"p","text":"Эта функциональность никак не связана со страницей Маркетинг → Рассылки → Подписчики, которая добавляется модулем “Рассылки”."},{"type":"p","text":"Если товара нет в наличии, покупатели могут подписаться на уведомление. Когда вы обновите количество товаров на складе, подписчики получат электронное письмо об этом."},{"type":"p","text":"У каждого товара есть свой список с электронными адресами подписчиков. Этот список и находится на вкладке Подписчики. Когда товар снова появляется в наличии, электронные письма отправляются подписчикам, а их электронные адреса удаляются из списка."},{"type":"p","text":"Процесс полностью автоматизирован. Однако вы можете добавить подписчика вручную, если это необходимо."},{"type":"p","text":"Подробнее о подписчиках можно узнать в этой статье."},{"type":"h2","text":"Модули"},{"type":"p","text":"Вкладка Модули содержит свойства товаров которые добавлены с помощью дополнительных модулей. Например:"},{"type":"h3","text":"Возврат товаров"},{"type":"p","text":"Эти свойства относятся к модулю “Возврат товаров”."},{"type":"bullet","level":0,"text":"Возможен возврат — если поставить галочку, то товар можно будет вернуть в магазин."},{"type":"bullet","level":0,"text":"Время возврата (в днях) — время, в течение которого товар можно вернуть. Отсчёт начинается в день покупки."},{"type":"h3","text":"Хиты продаж"},{"type":"p","text":"Эти свойства относятся к модулю “Хиты продаж и товары со скидкой”."},{"type":"bullet","level":0,"text":"Количество продаж — сколько экземпляров товара было продано. Рассчитывается автоматически, когда включен модуль Хиты продаж и товары со скидкой. Это значение можно изменить вручную."},{"type":"h3","text":"Проверка возраста"},{"type":"p","text":"Эти свойства относятся к модулю “Ограничение по возрасту”."},{"type":"bullet","level":0,"text":"Проверка возраста — если поставить галочку, то товар смогут увидеть только пользователи определённого возраста."},{"type":"bullet","level":0,"text":"Возрастное ограничение — минимальный возраст для просмотра этого товара."},{"type":"bullet","level":0,"text":"Предупреждение — сообщение, которое увидит покупатель, если он не может просмотреть товар из-за своего возраста."},{"type":"h3","text":"Комментарии и отзывы"},{"type":"p","text":"Эти свойства относятся к модулю Отзывы и комментарии."},{"type":"bullet","level":0,"text":"Отзывы — выберите, разрешить ли пользователям оставлять оценки и/или комментарии к товару."},{"type":"h2","text":"Характеристики"},{"type":"p","text":"На этой вкладке можно задать значения дополнительных полей, которые относятся к товару. Эти дополнительные поля создаются на странице Товары → Характеристики."},{"type":"h2","text":"Вкладки товара"},{"type":"p","text":"На этой вкладке находится список вкладок, которые будут отображаться на странице этого товара. Рядом с каждой вкладкой есть статус — Вкл. или Выкл. Добавлять и редактировать вкладки можно на странице Дизайн → Вкладки товара."},{"type":"p","text":"Чтобы увидеть, как выглядит страница товара, нажимте на кнопку с изображением шестерёнки и выберите вариант Предпросмотр."},{"type":"h2","text":"Комбинации товаров"},{"type":"p","text":"Эта вкладка появляется, если включен модуль “Комбинации товаров”."},{"type":"link","text":"“Комбинации товаров”","url":"https://www.cs-cart.ru/docs/latest/user_guide/addons/buy_together/index.html"},{"type":"p","text":"На этой вкладке можно связывать товары из каталога друг с другом и предлагать скидку, если товары покупаются вместе. Такая связка называется комбинацией товаров. Информация о скидке появляется на странице товара на витрине, а покупатели решают, воспользоваться ли предложением."},{"type":"p","text":"Помимо самих товаров и размера скидки, у комбинации товаров есть следующие свойства:"},{"type":"bullet","level":0,"text":"Название — название комбинации товаров."},{"type":"bullet","level":0,"text":"Описание — описание комбинации товаров, которое появится на витрине."},{"type":"bullet","level":0,"text":"Задать период доступности — если поставить галочку, то можно настроить:"},{"type":"bullet","level":1,"text":"Доступна с — дата, с которой комбинация товаров доступна для покупателей."},{"type":"bullet","level":1,"text":"Доступна до — дата, до которой комбинация товаров доступна для покупателей."},{"type":"bullet","level":0,"text":"Показывать в промо-акциях — если поставить галочку, эта комбинация товаров появится в списке промо-акций (index.php?dispatch=promotions.list)."},{"type":"bullet","level":0,"text":"Статус — статус комбинации товаров (Вкл. или Выкл.)."},{"type":"h2","text":"Теги"},{"type":"p","text":"Эта вкладка появляется, если включен модуль “Теги”."},{"type":"p","text":"На этой вкладке находится список тегов, связанный с товаром. Теги появляются на витрине в блоке Теги."},{"type":"bullet","level":0,"text":"Теги — список тегов товара. Когда вы начинаете печатать название тега, CS-Cart автоматически предлагает возможные варианты из существующих тегов."},{"type":"images","files":["product-properties-05.png"]},{"type":"h2","text":"Прикреплённые файлы"},{"type":"p","text":"Эта вкладка появляется, если включен модуль “Прикреплённые файлы”."},{"type":"p","text":"На этой вкладке находятся файлы, связанные с товаром. В отличие от “Продаваемых файлов”, эта вкладка доступна не только для цифровых товаров. У каждого прикреплённого файла есть следующие свойства:"},{"type":"bullet","level":0,"text":"Название — название прикреплённого файла."},{"type":"bullet","level":0,"text":"Позиция — положение прикреплённого файла в списке относительно положения других файлов."},{"type":"bullet","level":0,"text":"Файл — сам файл, который нужно загрузить."},{"type":"bullet","level":0,"text":"Группы пользователей — группы пользователей, которым доступен файл."},{"type":"h2","text":"Бонусные баллы"},{"type":"p","text":"Эта вкладка появляется, если включен модуль “Бонусные баллы”."},{"type":"p","text":"На этой вкладке задается цена товара в бонусных баллах и количество баллов, получаемых за покупку товара."},{"type":"h3","text":"Цена в баллах"},{"type":"bullet","level":0,"text":"Разрешить оплату баллами — если поставить галочку, покупатель сможет оплатить этот товар баллами."},{"type":"bullet","level":0,"text":"Заменить глобальный курс конвертации баллов — если поставить галочку, то у товара будет фиксированная цена в баллах; эта цена не будет зависеть от курса конвертации баллов."},{"type":"bullet","level":0,"text":"Цена в баллах — жёстко заданная цена товара в баллах."},{"type":"h3","text":"Баллы за товар"},{"type":"bullet","level":0,"text":"Заменить глобальные баллы и баллы категории для этого товара — если поставить галочку, то значения ниже перезапишут для этого товара настройки, которые задаются на странице Маркетинг → Бонусные баллы."},{"type":"bullet","level":0,"text":"Группа — группы пользователей, которые получают бонусные баллы за покупку товара."},{"type":"bullet","level":0,"text":"Сумма — количество бонусных баллов, которые получают пользователи за покупку товара."},{"type":"bullet","level":0,"text":"Тип количества — либо абсолютное значение, либо процент от стоимости."},{"type":"h2","text":"Отзывы"},{"type":"p","text":"Эта вкладка появляется, если включен модуль “Отзывы и комментарии”, а для товара включены отзывы или комментарии на вкладке Модули."},{"type":"p","text":"Список отзывов покупателей о товаре. Здесь можно добавлять отзывы или редактировать существующие."},{"type":"h2","text":"Обязательные товары"},{"type":"p","text":"Эта вкладка появляется, если включен модуль “Требуемые товары”."},{"type":"p","text":"На этой вкладке находится список товаров, которые обязательно будут добавлены в корзину вместе с этим товаром. Нажмите кнопку Добавить товары, чтобы выбрать обязательные товары."},{"type":"images","files":["product-properties-06.png"]},{"type":"h2","text":"Макеты"},{"type":"p","text":"Содержимое детальной страницы товара. Эта вкладка дублирует общий макет страницы товара."},{"type":"p","text":"Здесь вы можете отключить или включить блоки, изменяя таким образом страницу товара. Любое изменение, сделанное здесь, не затронет страницы других товаров."}]},{"id":"product-variations","title":"Вариации товаров","blocks":[{"type":"p","text":"Вариации товаров являются частью одноимённого модуля."},{"type":"p","text":"Вариации — это похожие товары, которые отличаются друг от друга одной или несколькими характеристиками. Например, “зелёная футболка “Спорт” размера S” и “красная футболка “Спорт” размера M”. Таким товарам нужно три вещи:"},{"type":"step","marker":"1","level":0,"text":"Дать покупателям выбрать нужные значения характеристик на странице товара."},{"type":"step","marker":"2","level":0,"text":"Показать часть вариаций (например, разные цвета) как отдельные позиции в каталоге. Так покупатель ещё до страницы товара увидит нужный цвет."},{"type":"step","marker":"3","level":0,"text":"Не показывать часть вариаций (например, размеры) как отдельные позиции в каталоге. Так покупатель не запутается среди множества товара с разными размерами и одинаковой картинкой."},{"type":"p","text":"в приложении на сайте"},{"type":"images","files":["product-variations-01.jpg","product-variations-02.png"]},{"type":"h2","text":"Терминология"},{"type":"p","text":"Группа вариаций — группа похожих товаров, которые отличаются друг от друга одной или несколькими характеристиками."},{"type":"p","text":"Вариация — товар, который относится к группе вариаций. Одновременно товар может относиться только к одной группе вариаций, но заменить группу у товара легко. Если вариацию отцепить от группы вариаций, она станет обычным товаром."},{"type":"p","text":"Позиция в каталоге — одно место на списке товаров. Пока не было вариаций, то “товар” и “позиция в каталоге” означали одно и то же. Но вариации могут и не занимать позицию в каталоге, поэтому возникла необходимость в таком термине."},{"type":"p","text":"Каждая вариация — это товар, но не каждый товар — вариация. Используйте Расширенный поиск на списке товаров в панели администратора: например там можно сделать так, чтобы на списке товаров были только вариации или только позиции в каталоге."},{"type":"p","text":"У футболки 3 цвета, по 5 размеров в каждом. В этом случае у нас 15 товаров. Мы хотим добавить переключение между ними и объединяем их в группу вариаций на основе характеристик “Цвет” и “Размер”. Теперь у нас 15 вариаций, и между всеми ними можно переключаться на их страницах."},{"type":"p","text":"В зависимости от настроек характеристик, эти 15 вариаций могут занимать:"},{"type":"bullet","level":0,"text":"1 позицию в каталоге — выбор цветов и размеров остаётся только на странице товара;"},{"type":"bullet","level":0,"text":"3 позиции в каталоге — футболки разных цветов отображаются на витрине как отдельные товары, а вот размеры можно выбрать только на странице товара;"},{"type":"bullet","level":0,"text":"5 позиций в каталоге — если кто-то решит отображать размеры как отдельные товары, а выбор цвета оставить только на странице товара; с футболками такое неактуально, но может подойти для других товаров."},{"type":"bullet","level":0,"text":"15 позиций в каталоге — когда каждый размер и цвет отображается как отдельный товар, т.е. каждой вариации соответствует своя позиция в каталоге.\nЭта схема работает, даже когда характеристик больше двух. Настройки характеристик можно поменять в любой момент, но количество занимаемых позиций изменится только после того, как вы распустите и пересоздадите группу вариаций. Подробности ниже."},{"type":"h2","text":"Работа с вариациями"},{"type":"h2","text":"Создание новой группы вариаций"},{"type":"p","text":"Предположим, вы добавили в свой магазин новый товар и хотите создать для него вариации. Сделать это можно прямо со страницы товара:"},{"type":"step","marker":"1","level":0,"text":"На странице товара откройте вкладку Вариации."},{"type":"step","marker":"2","level":0,"text":"Нажмите кнопку Добавить вариации."},{"type":"step","marker":"3","level":0,"text":"На вкладке Создать новые товары введите название характеристики. Если такая характеристика в вашем магазине уже существует, то она будет предложена.\nВ предложенных характеристиках отображаются далеко не все характеристики. Это зависит от того, какая Цель была указана в их настройках.\nЕсли ее еще не существует в магазине, нажмите кнопку Добавить и задайте одну из двух Целей для новой характеристики. От выбранной цели зависит, займут ли вариации с разными значениями этой характеристики отдельные позиции в каталоге."},{"type":"step","marker":"4","level":0,"text":"Добавьте Варианты для ваших характеристик."},{"type":"step","marker":"5","level":0,"text":"Нажмите кнопку Создать. Вариации сгенерируются автоматически."},{"type":"images","files":["product-variations-03.png"]},{"type":"p","text":"Если вы хотите поменять названия для созданной вариации к примеру “Футболка синяя Латекс” на “Футболка Латекс” так как при создании у всех товаров названия меняется на названия товара с которым связываете."},{"type":"p","text":"В настроке товара в 1с, в строке “Не обновлять наименование” проставьте галочку, чтоб при обмене товара названия на сменился."},{"type":"images","files":["product-variations-04.png"]},{"type":"h2","text":"Объединение товаров в группу вариаций"},{"type":"p","text":"Допустим, вы импортировали товары поставщика в свой магазин и хотите объединить какие-то товары в одну группу. Это позволит вашим покупателям выбирать их, просто переключаясь между вариациями, а не путаться в аналогичных товарах с разными вариантами характеристик. Для этого необходимо сделать следующее:"},{"type":"step","marker":"1","level":0,"text":"Зайдите на страницу одного из товаров и откройте вкладку Вариации."},{"type":"step","marker":"2","level":0,"text":"Нажмите кнопку Добавить вариации."},{"type":"step","marker":"3","level":0,"text":"Перейдите на вкладку Использовать существующие товары. На ней отобразятся аналогичные товары с такими же характеристиками.\nВ списке отобразятся товары, которые соответствуют трем условиям:"},{"type":"bullet","level":1,"text":"из той же категории;"},{"type":"bullet","level":1,"text":"с теми же характеристиками, но в других вариантах;"},{"type":"bullet","level":1,"text":"с Целями характеристик, позволяющими создавать вариации."},{"type":"step","marker":"4","level":0,"text":"Выделите нужные товары и нажмите кнопку Добавить вариации."},{"type":"images","files":["product-variations-05.png"]},{"type":"h2","text":"Управление и удаление"},{"type":"p","text":"Когда группа вариаций создана, то все товары из неё отображаются на вкладке Вариации у любого товара в группе. Здесь вы можете:"},{"type":"bullet","level":0,"text":"увидеть, какие из вариаций занимают позицию в каталоге, а какие — нет. У вариаций без своей позиции в каталоге картинка меньше;"},{"type":"bullet","level":0,"text":"указать, какую из нескольких вариаций делать выбранной по умолчанию для позиции в каталоге;\nОстальные вариации будут заимствовать многие свои свойства у вариации, выбранной по умолчанию."},{"type":"bullet","level":0,"text":"убрать вариацию из группы; товар при этом не пропадёт, а станет самостоятельным;"},{"type":"bullet","level":0,"text":"удалить вариацию насовсем;"},{"type":"bullet","level":0,"text":"поменять код группы — его можно использовать, чтобы потом добавлять другие товары в эту группу как вариации. Код группы может содержать только цифры, латиницу и знаки “-” и “_”;"},{"type":"bullet","level":0,"text":"добавить ещё вариаций в группу;"},{"type":"bullet","level":0,"text":"переключиться на редактирование вариаций на списке товаров — так можно получить доступ к массовому редактированию и удалению;"},{"type":"bullet","level":0,"text":"распустить группу — тогда все вариации из неё станут самостоятельными товарами, и пропадёт возможность переключаться между ними со страницы товара."},{"type":"images","files":["product-variations-06.png"]}]},{"id":"product-video-gallery","title":"Видео галерея товара","blocks":[{"type":"h2","text":"Добавление видео"},{"type":"p","text":"Чтобы добавить видео в галерею товара перейдите на страницу Панель администратора → Товары → Товары, выберите нужный товар для редактирования и перейдите на вкладку АВ: Видео галерея товара, где заполните все необходимые поля."},{"type":"images","files":["product-video-gallery-01.jpg"]},{"type":"bullet","level":0,"text":"Установить видео как изображение товара по умолчанию ‒ установите чекбокс, чтобы при переходе на страницу товара первым отображалось видео, как изображение товара по умолчанию."},{"type":"bullet","level":0,"text":"Поз. ‒ укажите позицию для поочередного размещения видео."},{"type":"bullet","level":0,"text":"Заголовок видео — укажите название видео, которое будет отображаться на витрине;"},{"type":"bullet","level":0,"text":"Тип видео ‒ укажите какой тип видео Вы загружаете. При выборе Ссылка будет доступно поле Атрибуты тега iframe;"},{"type":"bullet","level":0,"text":"ID видео URL-адреса — укажите ID видео или его URL-адрес. Например, для видео YouTube \"https://www.youtube.com/watch?v=-boKk8uhmcY\" ID видео является -boKk8uhmcY. Например, для видео Vimeo \"https://vimeo.com/560908404\" ID видео является 560908404. При выборе типа Ссылка ID видео будет весь URL-адрес. При выборе типа Ресурс URL-адрес является конкретным видеофайлом;"},{"type":"bullet","level":0,"text":"Тип иконки — выберите тип отображаемой иконки для видео как Кадр из видео или Ручная иконка. Если выбрано Ручная иконка, то можно добавить иконку самостоятельно;"},{"type":"bullet","level":0,"text":"Описание — задайте описание для видео, которое будет отображено на вкладке Видео галерея страницы карточки товара;"},{"type":"bullet","level":0,"text":"Атрибуты тега iframe ‒ контейнер, содержание которого игнорируется браузерами, не поддерживающими данный элемент. Для таких браузеров можно указать альтернативный текст, который увидят пользователи. Внимание! Значение этой настройки будет напрямую встроено в код. Будьте внимательны, заполняя её значение."}]},{"id":"product-out-stock","title":"Действия при отсутствии товара в наличии","blocks":[{"type":"p","text":"Если товара нет в наличии, то платформа позволяет вам выбрать, какие действия доступны для пользователя на странице товара. Перейдите на страницу Товары → Товары и нажмите на название товара. Откроется страница редактирования, а на ней вы сможете выбрать Действия при отсутствии товара в наличии:"},{"type":"bullet","level":0,"text":"Не выбрано — покупатель не сможет купить товар в одном из следующих случаев:"},{"type":"bullet","level":1,"text":"если товара нет в наличии;"},{"type":"bullet","level":1,"text":"если вы указали дату, начиная с которой товар будет доступен (Доступен с), а эта дата ещё не наступила."},{"type":"bullet","level":0,"text":"Предзаказ — покупатель сможет купить товар заранее, независимо от того, сколько экземпляров товара сейчас в наличии и указана ли дата доступности товара."},{"type":"bullet","level":0,"text":"Подписаться на уведомления — покупатель сможет подписаться на уведомление о том, что товар появился в наличии; это уведомление придёт по электронной почте.\n\nЕсли свойство товара Расчёт количества товара в наличии имеет значение Не отслеживать, то будет считаться, что товар всегда в наличии. То же самое произойдёт, если в разделе Настройки → Общие → Каталог поставить галочку Разрешить отрицательное количество товаров в наличии."},{"type":"images","files":["product-out-stock-01.png"]},{"type":"h2","text":"Не выбрано"},{"type":"p","text":"Кнопка В корзину не появится в следующих случаях:"},{"type":"bullet","level":0,"text":"В поле В наличии у товара значение 0, а отрицательное количество товаров в наличии запрещено."},{"type":"bullet","level":0,"text":"В поле Доступен с у товара указана дата, которая еще не наступила.\nЕсли у товара указана дата, с которой он будет доступен, покупатели увидят эту дату на странице товара."},{"type":"images","files":["product-out-stock-02.png"]},{"type":"h2","text":"Предзаказ"},{"type":"p","text":"Покупатели смогут купить товар заранее, независимо от того, сколько экземпляров товара сейчас в наличии и указана ли дата доступности товара. Количество такого товара в наличии может стать отрицательным, даже если отрицательное количество товаров в наличии запрещено на странице “Настройки → Общие”."},{"type":"images","files":["product-out-stock-03.png"]},{"type":"h2","text":"Подписаться на уведомления"},{"type":"p","text":"Если товара нет в наличии, вы можете разрешить покупателям подписаться на уведомление по электронной почте:"},{"type":"bullet","level":0,"text":"Зарегистрированным пользователям достаточно будет поставить галочку Сообщить мне, когда товар будет в наличии на странице товара."},{"type":"bullet","level":0,"text":"Гостям придётся ввести адрес электронной почты, куда нужно прислать уведомление."},{"type":"p","text":"Покупатели, которые подписались на уведомление, получат электронное письмо, как только товар появится в наличии."},{"type":"p","text":"Чтобы возможность подписаться на уведомления появилась, товар должен быть не в наличии."},{"type":"images","files":["product-out-stock-04.png"]},{"type":"h2","text":"Работа с подписками на товар"},{"type":"p","text":"Просмотреть список подписчиков можно двумя путями:"},{"type":"bullet","level":0,"text":"Чтобы увидеть количество подписчиков по товарам, откройте страницу Товары → Товары, нажмите на кнопку с изображением шестерёнки в правой верхней части страницы и выберите вариант Товары по подписке. Откроется список товаров, а рядом с каждым товаром в отдельной колонке будет указано количество подписчиков."},{"type":"bullet","level":0,"text":"Чтобы увидеть подписчиков на конкретный товар, откройте страницу Товары → Товары, нажмите на название нужного товара и перейдите на вкладку Подписчики."},{"type":"images","files":["product-out-stock-05.png"]},{"type":"p","text":"Чтобы добавить подписчика, воспользуйтесь одной из двух кнопок:"},{"type":"bullet","level":0,"text":"Добавить подписчика — ввести адрес электронной почты вручную."},{"type":"bullet","level":0,"text":"Выбрать покупателя — подписать одного или нескольких зарегистрированных покупателей.\nПосле того, как покупатель получает уведомление о том, что товар есть в наличии, адрес электронной почты этого покупателя будет убран из списка подписчиков на этот товар автоматически."},{"type":"p","text":"Чтобы удалить подписчиков из списка вручную, поставьте галочки рядом с их электронными адресами и нажмите на кнопку с изображением корзины."}]},{"id":"product-fractional","title":"Дробный остаток","blocks":[{"type":"p","text":"Модуль Дробный остаток позволяет продавать товары, используя не целочисленный остаток. Это используется для таких товаров как провод (в метрах), саморезы (в кг) и (в гр) и т. д."},{"type":"h2","text":"Особенности"},{"type":"bullet","level":0,"text":"Возможность продавать товары как упаковками так и дробным количеством"},{"type":"bullet","level":0,"text":"Возможность задавать шаг для поля \"Кол-во\" в карточке товара (как для каждого так и глобально)"},{"type":"bullet","level":0,"text":"Возможность задавать подпись для количества (гр., шт., м.) как для каждого товара так и глобально"},{"type":"bullet","level":0,"text":"Возможность оформлять и изменять заказы с дробным количеством из админ панели"},{"type":"bullet","level":0,"text":"Подстановка подписи количества товара во разные места в магазине (окно добавления в корзину, список товаров в корзине, детали заказа)"},{"type":"bullet","level":0,"text":"Работает с комбинациями опций"},{"type":"bullet","level":0,"text":"Возможность задавать минимальное количество для заказа как глобально так и для каждого товара"},{"type":"bullet","level":0,"text":"Возможность редактирования настроек дробного значения товаров через глобальное редактирование"},{"type":"bullet","level":0,"text":"Возможность импортировать - экспортировать значения \"Разрешить добавлять дробное значение\", \"Подпись ввода количества товара\", \"Шаг количества товара\""},{"type":"h2","text":"Настройка Видео по настройке"},{"type":"link","text":"Видео по настройке","url":"https://drive.google.com/file/d/1gOndcCx2iswRmQ7pjrKmFsQipEI1rxxc/view?usp=sharing"},{"type":"p","text":"Для разрешения использования дробного остатка в товаре нужно зайти в редактирование товара во вкладку Модули и внести соответствующие настройки"},{"type":"images","files":["product-fractional-01.png"]},{"type":"images","files":["product-fractional-02.png"]},{"type":"p","text":"Единица измерения количества выводится рядом с подписью поля \"Кол-во\" шт., м. кг. и т.д."},{"type":"p","text":"Шаг изменения количества товара - на сколько будет изменяться количество при нажатии + и -"},{"type":"p","text":"Минимальное количество товара для заказа - ограничивает кол-во товара для покупки"},{"type":"p","text":"Эти значение можно указать глобально, в настройках модуля, а также для каждого товара индивидуально."},{"type":"p","text":"Также при добавлении в корзину количество в данном случае будет округляться до одного знака после запятой."}]},{"id":"product-exchange-folder","title":"Как добавить новую папку с товарами для обмена","blocks":[{"type":"p","text":"Для того чтоб добавить новую папку для выгрузки на сайт создайте папку в материнской папке которая настроена на обмен (если в новой папке уже есть товары то не необходима после добавления в обмен перепровести все товары из этой папки). Перейдите в Wikki → настройка обмена по номенклатуре Откройте существующую настройку."},{"type":"images","files":["product-exchange-folder-01.png"]},{"type":"p","text":"В открывшемся окне в табличной части на страницу Группы номенклатуры → нажмите Заполнить"},{"type":"images","files":["product-exchange-folder-02.png"]},{"type":"p","text":"Выберите нужную папку → Заполнить далее Записать закрыть настройку."},{"type":"p","text":"(если в добавленной папке есть товары перепровести)"},{"type":"images","files":["product-exchange-folder-03.png"]}]},{"id":"product-max-qty","title":"Как задать максимальное количество экземпляров товара в заказе","blocks":[{"type":"p","text":"Чтобы задать максимальное количество экземпляров товара, которое пользователь сможет приобрести в заказе за один раз:"},{"type":"step","marker":"1","level":0,"text":"Откройте страницу Товары → Товары в панели администратора."},{"type":"step","marker":"2","level":0,"text":"Нажмите на название интересующего товара, чтобы открыть страницу редактирования."},{"type":"step","marker":"3","level":0,"text":"Введите нужное количество экземпляров товара в поле Максимальный заказ из раздела Ценообразование/Склад."},{"type":"images","files":["product-max-qty-01.png"]},{"type":"step","marker":"4","level":0,"text":"Нажмите кнопку Сохранить.\nПосле этого покупатель не сможет за один заказ приобрести больше экземпляров товара, чем указано в поле Максимальный заказ."}]},{"id":"product-min-qty","title":"Как задать минимальное количество экземпляров товара в заказе","blocks":[{"type":"p","text":"Чтобы задать минимальное количество экземпляров товара, которое пользователь сможет приобрести в заказе за один раз:"},{"type":"step","marker":"1","level":0,"text":"Откройте страницу Товары → Товары в панели администратора."},{"type":"step","marker":"2","level":0,"text":"Нажмите на название интересующего товара, чтобы открыть страницу редактирования."},{"type":"step","marker":"3","level":0,"text":"Введите нужное количество экземпляров товара в поле Минимальный заказ из раздела Ценообразование/Склад."},{"type":"images","files":["product-min-qty-01.png"]},{"type":"step","marker":"4","level":0,"text":"Нажмите кнопку Сохранить.\nПосле этого покупатель не сможет за один заказ приобрести меньше экземпляров товара, чем указано в поле Минимальный заказ."}]},{"id":"product-wholesale","title":"Как задать оптовые цены для товара","blocks":[{"type":"p","text":"Чтобы задать оптовые цены для товара:"},{"type":"step","marker":"1","level":0,"text":"Откройте страницу Товары → Товары в панели администратора."},{"type":"step","marker":"2","level":0,"text":"Нажмите на название интересующего товара, чтобы открыть страницу редактирования."},{"type":"step","marker":"3","level":0,"text":"Перейдите на вкладку Оптовые скидки."},{"type":"step","marker":"4","level":0,"text":"В поле Количество укажите минимальное количество товаров, которое нужно добавить в корзину, чтобы применилась оптовая цена. В поле значение задайте фиксированную оптовую цену за один экземпляр товара или размер скидки в процентах.\nВ выпадающем списке Группа можно выбрать группу пользователей, для которых будет действовать скидка. Пользователи из этой группы увидят скидку, но только если войдут в свои учётные записи."},{"type":"step","marker":"5","level":0,"text":"Чтобы добавить несколько уровней оптовых цен, нажмите иконку + и задайте другое количество и скидку."},{"type":"step","marker":"6","level":0,"text":"Нажмите кнопку Сохранить, чтобы применить изменения."},{"type":"p","text":"Вот как покупатели увидят оптовые скидки на витрине:"},{"type":"images","files":["product-wholesale-01.png"]},{"type":"p","text":"Если товар обменивается с 1с необходимо в созданной строке со скидкой поставить галочку в столбце Запретить обновление при обмене с 1С."},{"type":"images","files":["product-wholesale-02.png"]}]},{"id":"product-bulk-property","title":"Как поменять определённое свойство у всех товаров","blocks":[{"type":"step","marker":"1","level":0,"text":"Откройте страницу Товары → Товары в панели администратора."},{"type":"step","marker":"2","level":0,"text":"Поменяйте количество отображаемых товаров на 250 на странице.\nВ ссылке в браузере появится параметр items_per_page=250. Если вы увеличите значение в ссылке, то в списке отобразится больше 250 товаров на одной странице."},{"type":"step","marker":"3","level":0,"text":"Поставьте галочку слева над списком товаров, чтобы выбрать все товары, отображаемые на странице."},{"type":"step","marker":"4","level":0,"text":"Нажмите кнопку Редактировать выбранные над списком товаров."},{"type":"images","files":["product-bulk-property-01.png"]},{"type":"step","marker":"5","level":0,"text":"В открывшемся окне нажмите Снять выделение со всех. Затем отметьте галочками те свойства товаров, которые хотите отредактировать (например, Расчет количества товаров в наличии) и нажмите кнопку Редактировать выбранные."},{"type":"images","files":["product-bulk-property-02.png"]},{"type":"step","marker":"6","level":0,"text":"Нажмите на ссылку Применить значения к выделенным товарам. Откроется еще один небольшой раздел."},{"type":"step","marker":"7","level":0,"text":"Поставьте галочку рядом со свойством, которое хотите изменить для всех товаров."},{"type":"step","marker":"8","level":0,"text":"Укажите необходимое значение свойства."},{"type":"step","marker":"9","level":0,"text":"Нажмите кнопку Применить, чтобы это значение свойства применилось ко всем выбранным товарам."},{"type":"step","marker":"10","level":0,"text":"Повторите все эти шаги для всех страниц с товарами."},{"type":"images","files":["product-bulk-property-03.png"]}]},{"id":"product-quantity-variants","title":"Как предоставить покупателю выбор количества товара в виде нескольких определённых вариантов","blocks":[{"type":"step","marker":"1","level":0,"text":"Откройте страницу Товары → Товары в панели администратора."},{"type":"step","marker":"2","level":0,"text":"Нажмите на название интересующего товара, чтобы открыть страницу редактирования."},{"type":"step","marker":"3","level":0,"text":"В настройке Шаг списка выбора количества из раздела Ценообразование/Склад укажите, с каким шагом можно менять количество товаров в корзине.\nНапример, если Шаг списка выбора количества равен 2, то покупатель сможет выбрать только 2, 4, 6, 8, 10, и т.д. экземпляров товара в выпадающем списке. Если в наличии имеется только 5 экземпляров, то в выпадающем списке будут варианты 2 и 4."},{"type":"step","marker":"4","level":0,"text":"В поле Максимальное число вариантов в списке выбора количества укажите, сколько вариантов количества (например, 4) может быть в выпадающем списке.\nНапример, если в наличии 20 товаров, шаг списка выбора количества равен 2, а максимально число вариантов количества равно 4, то пользователь сможет выбрать варианты количества 2, 4, 6, 8 в выпадающем списке."},{"type":"images","files":["product-quantity-variants-01.png"]},{"type":"step","marker":"5","level":0,"text":"Нажмите кнопку Сохранить."}]},{"id":"product-attach-file","title":"Как прикрепить файл к товару","blocks":[{"type":"p","text":"Возможность прикрепить файл к товару нужна, если вы хотите предоставить какую-то информацию существующим и будущим покупателям. Например, если вы продаёте программы, то можете прикрепить PDF-файл с руководством пользователя. Этот файл смогут скачать все пользователи, которые посетят страницу товара."},{"type":"step","marker":"1","level":0,"text":"Откройте страницу Товары → Товары в панели администратора."},{"type":"step","marker":"2","level":0,"text":"Нажмите на название интересующего товара, чтобы открыть страницу редактирования."},{"type":"step","marker":"3","level":0,"text":"Перейдите на вкладку Прикрепленные файлы и нажмите кнопку Прикрепить файл.\nВкладка Прикрепленные файлы появится, только если на странице Модули → Управление модулями включен модуль Прикрепленные файлы."},{"type":"step","marker":"4","level":0,"text":"Откроется форма прикрепления файла. Выберите файл для загрузки и задайте его название."},{"type":"step","marker":"5","level":0,"text":"Нажмите кнопку Создать.\nПокупатель сможет скачать файл на странице товара на витрине, во вкладке Прикрепленные файлы."},{"type":"images","files":["product-attach-file-01.png"]}]},{"id":"product-create-variants","title":"Как создать несколько разновидностей одного товара","blocks":[{"type":"p","text":"Нередко возникают ситуации, когда у одной модели товара в магазине много разновидностей. Например, у одежды это цвета, размеры, фасоны. Раньше такие разновидности создавались с помощью опций. Но у такого способа есть недостатки:"},{"type":"bullet","level":0,"text":"нельзя отследить количество каждой разновидности на складе;"},{"type":"bullet","level":0,"text":"нельзя добавить каждой разновидности своё изображение."},{"type":"p","text":"Опции могут подойти для товаров, которые делаются под заказ. Например, когда клиент выбирает стол с индивидуальными размерами под заказ. Или когда на кубок наносят какую-нибудь гравировку."},{"type":"p","text":"Неотъемлемые свойства товара лучше задавать с помощью характеристик. Например, когда вы продаёте готовые столы, им нельзя поменять цвет. Но можно предложить клиенту похожий готовый стол другого цвета. Для этого служат вариации. Тогда у каждой разновидности товара будет свой артикул, цена, изображение, параметры доставки и пр."},{"type":"h2","text":"Шаг 1. Создаём эталонный товар"},{"type":"p","text":"Когда мы создаём товар с разновидностями с нуля, то сначала создаём эталонный товар (он же родительский). На его основе потом автоматически создаются разновидности (вариации)."},{"type":"step","marker":"1","level":0,"text":"Создайте товар. В этом примере мы создадим велосипед."},{"type":"step","marker":"2","level":0,"text":"Перейдите на вкладку Характеристики. Здесь вы можете добавить характеристики для вашего товара, на основе которых будут созданы вариации. У велосипеда это могут быть “Цвет”, “Размер колеса” и “Размер рамы”."},{"type":"step","marker":"3","level":0,"text":"При создании каждой характеристики обязательно нажмите кнопку Расширенное создание характеристики. Там характеристикам нужно выбрать свойства, чтобы потом на основе этих характеристик можно было задать вариации:"},{"type":"bullet","level":1,"text":"Для характеристики “Цвет” выберите Цель — Вариации как отдельные товары. Тогда покупатель увидит велосипеды всех цветов как отдельные товары в каталоге и в результатах поиска. Чтобы выбор характеристик происходил через картинки, в свойствах Внешнего вида выберите Изображения."},{"type":"bullet","level":1,"text":"Для характеристик “Размер колеса” и “Размер рамы” выберите Цель — Вариации как один товар. Тогда покупатель сможет выбирать варианты этих характеристик в карточке товара, а в каталоге и в результатах поиска не будет много похожих товаров с одинаковой картинкой. Эти характеристики удобнее выбирать через выпадающий список. Для этого свойствах Внешнего вида выберите Выпадающий список.\n\nЧтобы покупателям потом было проще найти товар на витрине, добавьте фильтры по созданным характеристикам."},{"type":"images","files":["product-create-variants-01.png"]},{"type":"h2","text":"Шаг 2. Создаём разновидности"},{"type":"p","text":"Когда эталонный товар и его характеристики созданы, то остальные сочетания характеристик (вариации) можно создать автоматически. Создадим вариации для велосипеда:"},{"type":"step","marker":"1","level":0,"text":"На странице созданного товара перейдите на вкладку Вариации и нажмите Добавить вариации."},{"type":"step","marker":"2","level":0,"text":"На этой странице уже отображаются три созданные характеристики, по которым можно создать вариации велосипеда. Чтобы добавить все сочетания цветов и размеров колеса и рамы, добавьте характеристики через кнопку Добавить все варианты."},{"type":"step","marker":"3","level":0,"text":"В списке создаваемых вариаций назначьте цены для каждой разновидности товара и количество этих товаров."},{"type":"step","marker":"4","level":0,"text":"Нажмите кнопку Создать X вариаций.\nУ нас получилось 18 разных велосипедов. Теперь у любого из них можно перейти на страницу редактирования и поправить цену, вес или ещё какие-нибудь свойства."},{"type":"images","files":["product-create-variants-02.png"]}]},{"id":"product-returns","title":"Возврат товаров","blocks":[{"type":"p","text":"Модуль “Возврат товаров” позволяет упростить процесс управления возвратом товаров. Когда модуль активен, покупатели регистрируют запросы на возврат товаров, указывая причину возврата и любую дополнительную информацию. После этого администраторы магазинов обрабатывают запросы при помощи специального раздела в панели администрирования."},{"type":"p","text":"Товары можно вернуть в течении 14 дней"},{"type":"h2","text":"Как работать с запросами на возврат"},{"type":"p","text":"На странице Заказы → Запросы на возврат находится список запросов на возврат товаров. Этот список можно сортировать и фильтровать по разным параметрам. Чтобы отфильтровать список, воспользуйтесь панелью поиска справа."},{"type":"p","text":"Чтобы работать с определённым запросом, нажмите соответствующую ему кнопку с изображением шестерёнки и выберите Редактировать. Это откроет страницу с информацией о запросе на возврат; страница разделена на 4 вкладки:"},{"type":"bullet","level":0,"text":"Информация о товарах на возврат — список товаров из запроса, возврат которых одобрен или будет одобрен."},{"type":"bullet","level":0,"text":"Информация об отклоненных товарах — список товаров из запроса, возврат которых не будет одобрен."},{"type":"bullet","level":0,"text":"Комментарии — комментарии о запрошенном возврате; эти комментарии увидит покупатель."},{"type":"bullet","level":0,"text":"Действия — действия, которые можно совершить над запросом."},{"type":"h2","text":"Как изменить статус запроса"},{"type":"step","marker":"1","level":0,"text":"Откройте страницу Заказы → Запросы на возврат."},{"type":"step","marker":"2","level":0,"text":"Нажмите на ID запроса."},{"type":"step","marker":"3","level":0,"text":"Перейдите на вкладку Действия."},{"type":"step","marker":"4","level":0,"text":"Выберите новый статус из выпадающего списка."},{"type":"step","marker":"5","level":0,"text":"Если необходимо, укажите, что заказ нужно пересчитать."},{"type":"step","marker":"6","level":0,"text":"Если необходимо, укажите, что нужно отправить электронное письмо покупателю и в отдел оформления и обработки заказов."},{"type":"step","marker":"7","level":0,"text":"Нажмите на кнопку Сохранить, чтобы изменения применились."},{"type":"h2","text":"Как одобрить/запретить возврат отдельных товаров из заказа"},{"type":"p","text":"Если в запросе на возврат много товаров, но вы примете возврат только некоторых из них, то вы можете исключить те товары, которые вы не примете, из списка товаров, одобренных на возврат."},{"type":"p","text":"Чтобы отклонить возврат одного или нескольких товаров:"},{"type":"step","marker":"1","level":0,"text":"Откройте страницу Заказы → Запросы на возврат."},{"type":"step","marker":"2","level":0,"text":"Нажмите на ID запроса. Вы попадёте на вкладку Информация о товарах на возврат."},{"type":"step","marker":"3","level":0,"text":"Отметьте галочками товары, возврат которых вы не примете."},{"type":"step","marker":"4","level":0,"text":"Нажмите кнопку Отклонить товары над списком товаров."},{"type":"p","text":"Товары, возврат которых был отклонён, будут перенесены в отдельный список. Чтобы одобрить отклонённый товар:"},{"type":"step","marker":"1","level":0,"text":"Перейдите на вкладку Информация об отклонённых товарах."},{"type":"step","marker":"2","level":0,"text":"Отметьте галочками те товары, возврат которых вы примете."},{"type":"step","marker":"3","level":0,"text":"Нажмите кнопку Принять товары над списком товаров."},{"type":"p","text":"Товары появятся в списке одобренных к возврату."},{"type":"h2","text":"Как распечатать опись вложения"},{"type":"p","text":"Вы можете распечатать упаковочный лист для возвращаемых товаров."},{"type":"p","text":"Чтобы распечатать упаковочный лист для одного запроса на возврат:"},{"type":"step","marker":"1","level":0,"text":"Откройте страницу Заказы → Запросы на возврат."},{"type":"step","marker":"2","level":0,"text":"Нажмите на ID запроса."},{"type":"step","marker":"3","level":0,"text":"Нажмите на кнопку с изображением шестерёнки в правой верхней части страницы."},{"type":"step","marker":"4","level":0,"text":"Выберите Распечатать реестр."},{"type":"p","text":"Чтобы распечатать упаковочные листы сразу для нескольких запросов на возврат:"},{"type":"step","marker":"1","level":0,"text":"Откройте страницу Заказы → Запросы на возврат."},{"type":"step","marker":"2","level":0,"text":"Отметьте нужные запросы галочками."},{"type":"step","marker":"3","level":0,"text":"Нажмите на кнопку с изображением шестерёнки в правой верхней части страницы."},{"type":"step","marker":"4","level":0,"text":"Выберите Пакетная печать упаковочного листа.\nВ упаковочном листе перечислены только те товары, которые одобрены к возврату."}]},{"id":"product-unit-price","title":"Цена за единицу","blocks":[{"type":"p","text":"Добавлен модуль, который позволяет указывать цену за единицу товара (литр, миллилитр, килограмм и т. д.)"},{"type":"p","text":"Если в вашем магазине выставлены на продажу несколько товаров в упаковке или коробке, то такую группу товаров выгодно продавать со скидкой. Когда покупатель видит, сколько можно сэкономить, приобретая сразу несколько товаров в одной коробке, ему легче принять решение о покупке. С помощью модуля “Цена за единицу” можно указать на витрине цену за единицу и за группу товаров."},{"type":"images","files":["product-unit-price-01.png"]},{"type":"h2","text":"Функциональность"},{"type":"p","text":"В панели администратора на странице редактирования товара добавлен раздел «Цена за единицу». Там вы указываете желаемую единицу измерения, например «мл», «г» или «шт», и количество единиц в товаре. Также укажите количество единиц, для которых будет отображаться цена, если вам нужно, чтобы цена была «за 1 шт» или «за 250 мл» вместо «за мл»."},{"type":"images","files":["product-unit-price-02.png"]},{"type":"p","text":"Например, продается коробка с 200 дюбеля. На витрине, на списке товаров и на странице с самим товаром, цена за один появится автоматически. Для этого в настройках нужно указать единицу измерения «шт» и количество единиц в товаре «200»."}]},{"id":"product-add-folder","title":"Как добавить новую папку с товарами","blocks":[{"type":"images","files":["product-add-folder-01.png"]},{"type":"images","files":["product-add-folder-02.png"]},{"type":"images","files":["product-add-folder-03.png"]},{"type":"images","files":["product-add-folder-04.png"]}]},{"id":"product-vat","title":"Налог НДС","blocks":[{"type":"h2","text":"Индивидуально для товара"},{"type":"p","text":"Перейдите в настройку товара на страниуе Общее в поле Налог поставьте галочку в нужный НДС"},{"type":"images","files":["product-vat-01.png","product-vat-02.png"]},{"type":"h2","text":"Для массовой настройке"},{"type":"p","text":"Перейдите в раздел Товары, Выделите нужное – Редактировать выбранные"},{"type":"images","files":["product-vat-03.png"]},{"type":"p","text":"открывшемся окне снимите все галочки и выберите налоги"},{"type":"images","files":["product-vat-04.png"]},{"type":"images","files":["product-vat-05.png"]},{"type":"p","text":"На следующей странице примените настройки для всех выделенных товаров"},{"type":"images","files":["product-vat-06.png"]}]}]},{"id":"1c","title":"Обмен и настройки 1С","icon":"sync","description":"Номенклатура, заказы и привязка покупателей","articles":[{"id":"1c-nomenclature","title":"Настройка номенклатуры и контрагента в 1С","blocks":[{"type":"h2","text":"Все товары которые должны представлены в"},{"type":"images","files":["1c-nomenclature-page-01.png"]},{"type":"h2","text":"У дилеров должно быть правильно заполнен"},{"type":"images","files":["1c-nomenclature-page-02.png"]}]},{"id":"1c-orders","title":"Настройка списка заказов в 1С","blocks":[{"type":"h2","text":"Как отличать заказы созданные онлайн от созданных"},{"type":"images","files":["1c-orders-page-01.png"]},{"type":"h2","text":"1"},{"type":"images","files":["1c-orders-page-02.png"]},{"type":"h2","text":"Во вкладке условное"},{"type":"images","files":["1c-orders-page-03.png"]},{"type":"h2","text":"Для того чтобы текст онлайн заказов в"},{"type":"images","files":["1c-orders-page-04.png"]},{"type":"h2","text":"3"},{"type":"images","files":["1c-orders-page-05.png"]},{"type":"h2","text":"Как скопировать настроенный список заказов для других пользователей"},{"type":"images","files":["1c-orders-page-06.png"]}]},{"id":"1c-customer","title":"Привязка покупателя к 1С","blocks":[{"type":"p","text":"Для запуска двухстороннего обмена заказы, оплаты, задолженности клиента, Клиент должен зарегистрироваться в приложении вы находите этого клиента в 1с и прописываете его ID на сайте в 1с."},{"type":"step","marker":"1","level":0,"text":"После регистрации клиента в приложении откройте админпанель приложения. В разделе Покупатели найдите клиента, на первом столбце прописан ID клиента, скопируйте его."},{"type":"link","text":"админпанель","url":"https://wikki.market/vendor.php"},{"type":"images","files":["1c-customer-01.png"]},{"type":"step","marker":"2","level":0,"text":"Перейдите в 1с раздел Настройки → Обмен с Wikki(оси)"},{"type":"images","files":["1c-customer-02.png"]},{"type":"step","marker":"3","level":0,"text":"Откройте документ обмена и перейдите в раздел Идентификаторы объектов"},{"type":"images","files":["1c-customer-03.png"]},{"type":"step","marker":"4","level":0,"text":"На открывшейся странице нажмите Создать, в поле Объект нажмите на три точки и выберите Контрагенты. Найдите контрагента в списке"},{"type":"images","files":["1c-customer-04.png"]},{"type":"step","marker":"5","level":0,"text":"В поле Идентификатор вставьте скопированный ID клиента"},{"type":"step","marker":"6","level":0,"text":"Нажмите Записать и закрыть."},{"type":"p","text":"С этого момента у клиента в личном кабинете будут появлятся история заказов, оплаты и задолженности."},{"type":"warning","text":"P.S если при вводе идентификатора появится уведомление что обнаружен дубли, удалите все дубли и нажмите повторно на Записать закрыть"},{"type":"images","files":["1c-customer-05.png"]}]}]},{"id":"warehouses","title":"Склады","icon":"warehouse","description":"Сценарии работы складов, магазинов и ПВЗ","articles":[{"id":"warehouses-description","title":"Описания и настройки","blocks":[{"type":"step","marker":"1","level":0,"text":"вариант"},{"type":"p","text":"Есть один основной магазин-склад откуда доставляется на все другие магазины и ПВЗ - На витрине доступно для заказа остатки выбранного магазина + основной магазин-склад."},{"type":"p","text":"Пример: товар на остатке магазине А - 1шт, в магазина В - 1шт, в магазина С - 1шт. У покупателя выбран магазин В, на витрине будет доступно для покупки 2шт. (остатки м-на А+В). Покупателю при оформлении заказа будет предложено ПВЗ А и В, т.к магазин А-основной с которого доставляется на другие. Покупатель оформляет заказ на 2 шт и выбирает пункт самовывоза магазин В, то в 1с создается заказ на склад В и на основании заказа автоматически создастся документ перемещение со склада А на склад В на 1 шт, документ будет не проведенным."},{"type":"p","text":"(подходит для магазинов которые делают перемещение только с основного магазина на другие филиалы и ПВЗ ежедневно)."},{"type":"step","marker":"2","level":0,"text":"вариант"},{"type":"p","text":"Все магазины доставляют на другие филиалы и ПВЗ. На витрине товары доступны со всех филиалов. - Покупателю доступно к заказу все что есть на остатке во всех магазинах и складов. Продавец сам решает с какого склада довести в выбранный покупателем ПВЗ в случае недостатка."},{"type":"p","text":"Пример: товар на остатке магазине А - 1шт, в магазина В - 1шт, в магазина С - 1шт. На витрине будет доступно для покупки 3шт. (остатки м-на А+В+С). Покупателю при оформлении заказа будет предложено ПВЗ А, В и С. Покупатель оформляет заказ на 2 шт и выбирает пункт самовывоза магазин В, то в 1с создается заказ на склад В. Продавец видит что не хватает к заказу 1 шт. и самостоятельно принимает решение с какого склада довезет недостающий товар на склад В. Перемещение в 1с создается в ручную."},{"type":"p","text":"(подходит для магазинов которые делают перемещение с любого магазина на другие филиалы и ПВЗ ежедневно)."},{"type":"step","marker":"3","level":0,"text":"вариант"},{"type":"p","text":"Когда магазин не делает доставки в филиалы. Каждый филиал продает только то что есть у них в наличии - На витрине доступно товары только выбранного магазина."},{"type":"p","text":"Пример: товар на остатке магазине А - 1шт, в магазина В - 1шт, в магазина С - 1шт. У покупателя выбран магазин В, на витрине будет доступно для покупки 1шт. (остатки м-на В). Покупателю при оформлении заказа будет предложено ПВЗ только В т.к магазины не доставляют на другие филиалы. Покупатель оформляет заказ на 1 шт и выбирает пункт самовывоза магазин В, то в 1с создается заказ на склад В."},{"type":"p","text":"(подходит для магазинов которые НЕ делают перемещение на другие филиалы)."},{"type":"h2","text":"Модуль позволяет:"},{"type":"bullet","level":0,"text":"задавать разное количество товара на разных оффлайн-точках (магазинах и складах);"},{"type":"bullet","level":0,"text":"получать эти точки и актуальное количество на них из систем учёта (например, 1C);"},{"type":"bullet","level":0,"text":"экспортировать и импортировать количество товаров на каждой точке;"},{"type":"bullet","level":0,"text":"показывать покупателям наличие в магазинах;"},{"type":"bullet","level":0,"text":"ограничить, с каких складов и в какие регионы вы можете доставить товар;"},{"type":"bullet","level":0,"text":"задать для каждого региона, откуда в первую очередь туда везти и списывать товары;"},{"type":"h2","text":"Как создать магазин или склад?"},{"type":"p","text":"Магазины и склады основаны на пунктах самовывоза. Чтобы создать склад, выберите соответствующий тип в настройках Администрирование - пункта самовывоза: “пункт самовывоза”, “магазин” и “склад”."},{"type":"images","files":["warehouses-description-01.png"]},{"type":"h2","text":"Чем отличаются ПВЗ, магазины и склады?"},{"type":"table","rows":[["","Пункт\nсамовывоза","Магазин","Склад"],["Отсюда возможен самовывоз*","✓","✓",""],["Отображается на странице товара","","✓",""],["Здесь хранится товар","","✓","✓"]]},{"type":"p","text":"* Т.е. эта точка отображается при оформлении заказа самовывозом и на странице корзина."}]}]},{"id":"blocks","title":"Блоки","icon":"blocks","description":"Макеты, блоки, баннеры и карточка товара","articles":[{"id":"blocks-edit","title":"Редактирование блоков","blocks":[{"type":"p","text":"Блоки наполняют структуру содержимым и рабочими элементами."},{"type":"p","text":"Блоки — это отдельные компоненты витрины: поисковые формы, переключатели языков и валют, меню, фильтры товаров, баннеры, списки товаров, текст, и другое содержимое. По сути, все элементы витрины отображаются с помощью блоков."},{"type":"h2","text":"Добавление блоков"},{"type":"p","text":"При добавлении блока есть 2 варианта:"},{"type":"bullet","level":0,"text":"Использовать существующий блок."},{"type":"bullet","level":0,"text":"Создать новый блок."},{"type":"h3","text":"Использование существующего блока:"},{"type":"step","marker":"1","level":0,"text":"Нажмите кнопку + на контейнере, в котором должен располагаться новый блок, и выберите Добавить блок."},{"type":"images","files":["blocks-edit-01.png"]},{"type":"step","marker":"2","level":0,"text":"Выберите вкладку Использовать существующий блок."},{"type":"step","marker":"3","level":0,"text":"Выберите блок из списка и нажмите на его иконку."},{"type":"p","text":"Блок появится рядом с другими блоками в контейнере."},{"type":"h3","text":"Создание нового блока:"},{"type":"step","marker":"1","level":0,"text":"Нажмите кнопку + на контейнере, в котором должен располагаться новый блок, и выберите Добавить блок."},{"type":"step","marker":"2","level":0,"text":"Выберите вкладку Создать новый блок."},{"type":"step","marker":"3","level":0,"text":"Выберите тип блока и нажмите на его иконку. Откроется окно настройки нового блока."},{"type":"step","marker":"4","level":0,"text":"Настройте параметры блока."},{"type":"step","marker":"5","level":0,"text":"Нажмите кнопку Создать."},{"type":"p","text":"Блок появится рядом с другими блоками в контейнере. Также блок будет добавлен в список существующих блоков"},{"type":"h2","text":"Редактирование блоков"},{"type":"step","marker":"1","level":0,"text":"Наведите курсор на нужный блок и нажмите на иконку шестеренки. Откроется окно настройки блока."},{"type":"step","marker":"2","level":0,"text":"Измените параметры блока."},{"type":"step","marker":"3","level":0,"text":"Нажмите Сохранить, чтобы изменения вступили в силу."},{"type":"images","files":["blocks-edit-02.png"]},{"type":"h2","text":"Удаление блоков"},{"type":"step","marker":"1","level":0,"text":"Наведите курсор на нужный блок и нажмите на иконку корзины."},{"type":"step","marker":"2","level":0,"text":"Во всплывающем окне подтвердите действие."},{"type":"images","files":["blocks-edit-03.png"]},{"type":"h2","text":"Изменение положения блоков на странице"},{"type":"p","text":"Для изменения положения блока просто перетащите его на нужное место."},{"type":"h2","text":"Использование блоков на отдельных страницах"},{"type":"p","text":"По умолчанию блоки прикрепляются ко всем страницам, связанным с определенной страницей макета (например, страница категории на витрине)."},{"type":"p","text":"Однако существует возмож
