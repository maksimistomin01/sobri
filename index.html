<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sobri — База знаний</title>
<style>
:root{
 --bg:#f5f7fb;--surface:#fff;--text:#111522;--muted:#6f7890;--line:#e7ebf3;
 --blue:#23a8f4;--blue-soft:#e8f7ff;--iris:#755cff;--shadow:0 18px 50px rgba(35,48,82,.08);
 --sidebar:245px;--max:1180px
}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button,input{font:inherit}button{color:inherit}a{text-decoration:none;color:inherit}
.layout{min-height:100vh;display:grid;grid-template-columns:var(--sidebar) 1fr}
.sidebar{height:100vh;position:sticky;top:0;padding:28px 20px;border-right:1px solid var(--line);background:rgba(255,255,255,.86);backdrop-filter:blur(14px)}
.logo{font-size:39px;font-weight:800;letter-spacing:-.075em;line-height:1}.logo i{font-style:normal;color:var(--blue)}
.logo-sub{margin:5px 0 24px;color:#7e899f;font-weight:650}
.nav{display:flex;flex-direction:column;gap:6px}
.nav-btn{width:100%;border:0;background:transparent;border-radius:13px;padding:12px 13px;text-align:left;display:flex;align-items:center;gap:11px;cursor:pointer;color:#43506a;font-weight:650}
.nav-btn:hover,.nav-btn.active{background:linear-gradient(90deg,#e6f5ff,#f1f7ff);color:#108fdf}
.nav-ico{width:22px;display:grid;place-items:center;color:#169de9;font-size:18px}
.help{position:absolute;left:20px;right:20px;bottom:24px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#eff6ff,#fff);padding:17px}
.help strong{display:block;margin-bottom:5px}.help p{margin:0 0 13px;font-size:13px;line-height:1.45;color:var(--muted)}
.help button{border:0;width:100%;padding:10px 12px;border-radius:11px;background:linear-gradient(90deg,var(--blue),#248bff);color:#fff;font-weight:750;cursor:pointer}
.main{min-width:0}.topbar{position:sticky;top:0;z-index:20;background:rgba(245,247,251,.86);backdrop-filter:blur(16px);border-bottom:1px solid rgba(231,235,243,.9)}
.topbar-inner{max-width:var(--max);margin:0 auto;padding:14px 24px;display:flex;gap:12px;align-items:center}
.search{flex:1;max-width:600px;position:relative}.search input{width:100%;height:44px;border:1px solid var(--line);border-radius:13px;background:#eef3fb;padding:0 18px 0 42px;outline:none}.search input:focus{background:#fff;border-color:#add7f6;box-shadow:0 0 0 4px rgba(35,168,244,.08)}
.search:before{content:"⌕";position:absolute;left:15px;top:9px;color:#73809a;font-size:22px}
.results{display:none;position:absolute;top:50px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:8px;max-height:430px;overflow:auto}
.result{padding:10px 12px;border-radius:10px;cursor:pointer}.result:hover{background:#f3f8fd}.result b{display:block;font-size:13px}.result small{color:#8490a6}
.content{max-width:var(--max);margin:0 auto;padding:24px 24px 56px}
.hero{border-radius:28px;padding:38px 40px;min-height:310px;background:
 radial-gradient(circle at 73% 22%,rgba(117,92,255,.24),transparent 30%),
 radial-gradient(circle at 35% 80%,rgba(35,168,244,.16),transparent 34%),
 linear-gradient(135deg,#f8fbff,#e8f5ff 58%,#f0efff);
 box-shadow:var(--shadow);display:grid;grid-template-columns:1fr .78fr;gap:24px;overflow:hidden}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#0d9ce9;font-weight:850;margin-bottom:14px}
.hero h1{font-size:50px;line-height:1.02;letter-spacing:-.055em;margin:0 0 14px}.hero h1 span{background:linear-gradient(90deg,#3a65ec,var(--iris));-webkit-background-clip:text;color:transparent}
.hero p{font-size:16px;line-height:1.55;color:#647086;max-width:620px;margin:0}
.hero-visual{position:relative;display:grid;place-items:center}.orb{width:220px;height:220px;border-radius:50%;background:linear-gradient(135deg,#2bb9ff,#795cff);box-shadow:0 30px 70px rgba(81,96,221,.25);display:grid;place-items:center;color:#fff;font-size:68px;font-weight:800}
.section-title{margin:30px 0 15px;font-size:25px;letter-spacing:-.03em}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:18px;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.card-top{display:flex;gap:13px;align-items:flex-start}.card-icon{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#e8f7ff,#dcedff);color:#1696e5;display:grid;place-items:center;font-size:23px}.card h3{margin:3px 0 5px;font-size:17px}.card p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}.card-meta{margin-top:16px;color:#8894aa;font-size:12px}
.page{display:none}.page.active{display:block}.back{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px;cursor:pointer;margin-bottom:16px}
.section-banner{background:#fff;border:1px solid var(--line);border-radius:23px;padding:28px;margin-bottom:14px}.section-banner h1{font-size:38px;letter-spacing:-.045em;margin:0 0 7px}.section-banner p{margin:0;color:var(--muted)}
.article-list{background:#fff;border:1px solid var(--line);border-radius:20px;padding:8px}.article-row{display:flex;gap:12px;align-items:center;padding:14px;border-radius:12px;cursor:pointer}.article-row:hover{background:#f6f9fd}.doc-icon{width:34px;height:34px;border-radius:10px;background:#eaf5ff;color:#168fdf;display:grid;place-items:center}.arrow{margin-left:auto;color:#8490a5}
.article-layout{display:grid;grid-template-columns:minmax(0,1fr) 235px;gap:20px}.article{background:#fff;border:1px solid var(--line);border-radius:24px;padding:34px}.crumbs{font-size:12px;color:#8a95a9;margin-bottom:13px}.article h1{font-size:42px;line-height:1.08;letter-spacing:-.045em;margin:0 0 20px}.article h2{font-size:27px;letter-spacing:-.03em;margin:34px 0 12px}.article h3{font-size:20px;margin:28px 0 10px}.article p{font-size:15px;line-height:1.7;color:#4f5b72;margin:10px 0}
.steps{counter-reset:step}.li{position:relative;padding:13px 0 13px 48px;min-height:44px;color:#374259;line-height:1.6}.li.level0{counter-increment:step}.li.level0:before{content:counter(step);position:absolute;left:0;top:9px;width:32px;height:32px;border-radius:10px;background:var(--blue-soft);color:#138fdf;font-weight:800;display:grid;place-items:center}.li.level1{padding-left:28px}.li.level1:before{content:"•";position:absolute;left:8px;color:var(--iris);font-size:20px}
.shots{display:grid;grid-template-columns:1fr;gap:12px;margin:14px 0 24px}.shots.two{grid-template-columns:1fr 1fr}.shot{border:1px solid var(--line);border-radius:17px;overflow:hidden;background:#f1f4f9;cursor:zoom-in}.shot img{display:block;width:100%;height:auto}
.video-link{display:inline-flex;align-items:center;gap:8px;background:#f0f7ff;color:#0f8fe0;border:1px solid #d8ebfb;border-radius:11px;padding:9px 12px;margin:3px 8px 8px 0;font-weight:700;font-size:13px}
.toc{position:sticky;top:84px;align-self:start;background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px}.toc strong{font-size:13px}.toc a{display:block;font-size:12px;color:#748097;margin-top:10px}
.overlay{display:none;position:fixed;inset:0;background:rgba(8,12,20,.76);z-index:99;place-items:center;padding:24px}.overlay.open{display:grid}.overlay img{max-width:96vw;max-height:92vh;border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.35)}.close{position:absolute;right:22px;top:20px;width:42px;height:42px;border:0;border-radius:50%;background:#fff;font-size:23px;cursor:pointer}
.external{background:#fff;border:1px dashed #bcd9ee;border-radius:18px;padding:24px}.external p{color:var(--muted)}.external a{display:inline-block;background:linear-gradient(90deg,var(--blue),#298bff);color:#fff;border-radius:11px;padding:11px 15px;font-weight:750}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{display:none}.hero{grid-template-columns:1fr}.hero-visual{display:none}.cards{grid-template-columns:1fr}.article-layout{grid-template-columns:1fr}.toc{display:none}}
@media(max-width:600px){.content,.topbar-inner{padding-left:13px;padding-right:13px}.hero{padding:28px 22px}.hero h1{font-size:38px}.article{padding:24px 18px}.article h1{font-size:32px}.shots.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
  <div class="logo">sobri<i>.</i></div><div class="logo-sub">База знаний</div>
  <nav class="nav" id="nav"><button class="nav-btn active" data-route="home"><span class="nav-ico">⌂</span>Главная</button></nav>
  <div class="help"><strong>Нужна помощь?</strong><p>Если не нашли ответ — напишите нам, мы поможем.</p><button>Написать в поддержку</button></div>
</aside>
<div class="main">
<header class="topbar"><div class="topbar-inner"><div class="search"><input id="search" placeholder="Поиск по документации..."><div class="results" id="results"></div></div></div></header>
<main class="content">
<section id="home" class="page active">
  <div class="hero"><div><div class="kicker">Документация · Sobri</div><h1>Все инструкции <span>в одном месте</span></h1><p>Тестовая версия базы знаний на реальных документах. Тексты и скриншоты открываются внутри соответствующих инструкций.</p></div><div class="hero-visual"><div class="orb">S</div></div></div>
  <h2 class="section-title">Разделы документации</h2><div class="cards" id="cards"></div>
</section>
<section id="sectionPage" class="page"></section>
<section id="articlePage" class="page"></section>
</main>
</div>
</div>
<div class="overlay" id="overlay"><button class="close" onclick="closeImg()">×</button><img id="overlayImg" alt=""></div>
<script>
const DATA={"sections": [{"id": "categories", "title": "Категории", "icon": "▱", "description": "Настройка категорий и сортировка товаров", "articles": [{"id": "categories-multi", "title": "Как отображать один и тот же товар в нескольких категориях", "blocks": [{"type": "li", "level": 0, "text": "Откройте страницу Товары → Товары в панели администратора."}, {"type": "li", "level": 0, "text": "Нажмите на название товара, который вы хотите добавить ещё в одну категорию."}, {"type": "li", "level": 0, "text": "Откроется страница редактирования товара. Нажмите кнопку Добавить категории."}, {"type": "li", "level": 0, "text": "Во всплывающем окне отметьте галочками категории, куда нужно добавить товар, и нажмите кнопку Добавить категории и закрыть."}, {"type": "li", "level": 0, "text": "Нажмите кнопку Сохранить и закрыть."}, {"type": "images", "files": ["categories-multi-01.png"]}]}, {"id": "categories-sort", "title": "Как сортировать товары в категории по позиции", "blocks": [{"type": "p", "level": 0, "text": "По умолчанию товары в категориях сортируются по алфавиту. Вы можете изменить порядок, в котором товары выводятся в категории. Для этого потребуется указать позиции товаров."}, {"type": "li", "level": 0, "text": "Откройте страницу Товары → Категории в панели администратора."}, {"type": "li", "level": 0, "text": "У каждой категории есть колонка Товары, где указано количество товаров в этой категории. Нажмите на это количество у категории, в которой вам нужно отсортировать товары."}, {"type": "images", "files": ["categories-sort-01.png"]}, {"type": "li", "level": 0, "text": "Откроется новая страница со списком товаров. Укажите позиции товаров."}, {"type": "images", "files": ["categories-sort-02.png"]}, {"type": "li", "level": 0, "text": "Нажмите кнопку Сохранить в правой верхней части страницы.\nПозиции повлияют на порядок товаров только если будет выбран один из видов сортировки по позиции.\nМожно сделать Сортировать по позиции: низкие позиции выше или Сортировать по позиции: высокие позиции ниже способом сортировки по умолчанию."}, {"type": "images", "files": ["categories-sort-03.png"]}, {"type": "p", "level": 0, "text": "Если в вашей витрине не достаточно сортировок из списка, обратитесь к главному с просьбой включить нужное администратору."}]}]}, {"id": "product", "title": "Товар", "icon": "◇", "description": "Настройки товаров, свойства, вариации и массовое редактирование", "articles": [{"id": "product-start", "title": "Начало настройки", "external": "https://drive.google.com/file/d/1FLERbaROUEyLV38CpHIhoMw1jhUmKude/view"}, {"id": "product-mass-edit", "title": "Массовое редактирование товаров", "blocks": [{"type": "p", "text": "Видео 1"}, {"type": "link", "text": "Видео 1", "url": "https://drive.google.com/file/d/1LOrtf40MiKTg6zMSR1-vgwPOsh50Sf1t/view?usp=drive_link"}, {"type": "p", "text": "Видео 2"}, {"type": "link", "text": "Видео 2", "url": "https://drive.google.com/file/d/1cSGAZNbl0ILW_u2umBfqcp0URR40zcFW/view?usp=drive_link"}, {"type": "h2", "text": "Вы можете отредактировать свойства сразу у нескольких товаров."}, {"type": "h2", "text": "Откройте в панели администратора магазина страницу Товары → Товары."}, {"type": "h2", "text": "Нажмите на товары, которые необходимо дублировать (клонировать)."}, {"type": "h2", "text": "Нажмите кнопку Редактировать выбранные над списком товаров."}, {"type": "images", "files": ["product-mass-edit-01.png"]}, {"type": "h2", "text": "Во всплывающем окне отметьте галочками свойства, которые хотите отредактировать у выбранных товаров. Затем нажмите кнопку Редактировать выбранные.\nНе выбирайте много настроек одновременно, иначе их будет неудобно редактировать."}, {"type": "images", "files": ["product-mass-edit-02.png"]}, {"type": "h2", "text": "Выбранные товары и их свойства будут доступны на одной странице. Отредактируйте их, а затем нажмите кнопку Сохранить в правой верхней части страницы.\nЧтобы применить одно значение свойства сразу ко всем выбранным товарам, воспользуйтесь ссылкой Применить значения к выделенным товарам."}, {"type": "images", "files": ["product-mass-edit-03.png"]}, {"type": "h2", "text": "Общее обновление"}, {"type": "h2", "text": "В CS-Cart есть специальная страница, где можно обновить некоторые свойства у всех товаров разом. Например, можно увеличить цену всех товаров на 10% или поднять рекомендованную цену, чтобы рядом со всеми товарами появилась информация о скидке."}, {"type": "h2", "text": "Чтобы обновить все товары разом:"}, {"type": "h2", "text": "Откройте страницу Товары → Товары в панели администратора."}, {"type": "h2", "text": "Нажмите на кнопку с изображением шестерёнки в правой верхней части страницы и выберите Редактировать все."}, {"type": "images", "files": ["product-mass-edit-04.png"]}, {"type": "h2", "text": "Откроется новая страница. На ней можно глобально обновить следующие свойства товаров:"}, {"type": "h2", "text": "Цена"}, {"type": "h2", "text": "Рекомендованная цена"}, {"type": "h2", "text": "В наличии (количество товаров в наличии)"}, {"type": "h2", "text": "Цена в баллах"}, {"type": "h2", "text": "По умолчанию, эти свойства обновятся у всех товаров. Но если воспользоваться кнопкой Добавить товары, то можно выбрать конкретные товары, которые нужно обновить."}, {"type": "h2", "text": "Укажите, как именно обновить свойства товаров, и нажмите Применить."}, {"type": "images", "files": ["product-mass-edit-05.png"]}]}, {"id": "product-properties", "title": "Свойства товаров (поля и настройки)", "blocks": [{"type": "p", "text": "При создании или редактировании товара можно указать много разных свойств. Для удобства они распределены по вкладкам на странице редактирования товара."}, {"type": "h3", "text": "Информация"}, {"type": "li", "level": 0, "text": "Название — название товара, которое отобразится на витрине и в панели администратора. Может быть разным для разных языков и витрин."}, {"type": "li", "level": 0, "text": "Категории — категории, к которым относится товар. Если у товара несколько категорий, то основной будет та, которая находится первой в списке. Чтобы изменить основную категорию, просто перетащите на её место другую."}, {"type": "li", "level": 0, "text": "Цена — цена товара в базовой валюте магазина. Цены для других валют конвертируются по заданному курсу. Все расчёты магазина выполняются в основной валюте."}, {"type": "li", "level": 0, "text": "Подробное описание — описание товара, которое появится на витрине на странице товара. Можно просто ввести текст или использовать HTML для форматирования. Если вы не знакомы с HTML, вы все равно сможете отформатировать текст с помощью визуального редактора: вы правите текст как в редакторе документов, а HTML-код добавляется автоматически."}, {"type": "li", "level": 0, "text": "Статус — статус товара:"}, {"type": "li", "level": 1, "text": "Вкл. — товар доступен на витрине и появляется в списке товаров."}, {"type": "li", "level": 1, "text": "Выкл. — товар нельзя посмотреть на витрине и приобрести."}, {"type": "li", "level": 1, "text": "Скрыто — товар не появляется в списке товаров на витрине, но доступен для покупателей по прямой ссылке."}, {"type": "li", "level": 0, "text": "Изображения — изображения товара. Поддерживаемые форматы: JPEG, GIF, PNG. Максимальный вес изображения зависит от настроек сервера; как правило, изображение должно весить не больше 1 мегабайт. Иконки будут созданы из изображений автоматически.\nОдно из загруженных изображений будет больше, чем все остальные. Это главное изображение товара, и оно отображается на списке товаров и на детальной странице товара по умолчанию. Чтобы изменить главное изображение, просто перетащите другое изображение на его место. Таким же образом можно менять порядок дополнительных изображений.\nПри наведении на изображение вы сможете просмотреть его в полном размере, удалить его, или отредактировать alt-текст (описание изображение, которое появляется, если само изображение по каким-то причинам не отображается). Описания изображений нужны, чтобы оптимизировать сайт для поисковых систем (SEO)."}, {"type": "h3", "text": "Настройки опций"}, {"type": "p", "text": "Следующие поля появляются, если на странице Настройки → Общие разрешено менять значение данной настройки на уровне отдельных объектов."}, {"type": "li", "level": 0, "text": "Тип опций — порядок выбора вариантов у опций товара:"}, {"type": "li", "level": 1, "text": "Одновременно — покупатели смогут выбрать варианты для разных опций независимо друг от друга и в любом порядке."}, {"type": "li", "level": 1, "text": "Последовательно — покупатели выбирают варианты для каждой опции пошагово: сначала вариант первой опции, затем второй, и т.д."}, {"type": "li", "level": 0, "text": "Опции — это определённые свойства товара, которые покупатель выбирает при покупке. Например, для одежды опциями могут быть цвет и размер. Вариантами таких опций могут быть красный/зелёный/синий и /M/L/XL/XXL соответственно."}, {"type": "li", "level": 0, "text": "Тип исключений — выберите тип исключений:"}, {"type": "li", "level": 1, "text": "Разрешение — на вкладке Опции вы сможете задать Разрешённые комбинации. Тогда покупатели смогут купить товар, только если комбинация вариантов опций находится в списке разрешённых."}, {"type": "li", "level": 1, "text": "Запрещение — на вкладке Опции вы сможете задать Запрещённые комбинации. Тогда покупатели смогут купить товар, только если комбинация вариантов опций не находится в списке запрещённых."}, {"type": "h3", "text": "Ценообразование / Склад"}, {"type": "li", "level": 0, "text": "КОД — идентификатор товарной позиции в вашем магазине (SKU); по коду при импорте определяется, к какому именно товару относится строка с данными."}, {"type": "li", "level": 0, "text": "Рекомендованная цена — если значение здесь выше, чем в поле Цена, то у товара на витрине появится отметка о скидке."}, {"type": "li", "level": 0, "text": "В наличии — количество товара на складе. Товар, который закончился на складе, нельзя купить, если только на странице Настройки → Общие → Каталог не стоит галочка Разрешить отрицательное количество товаров на складе."}, {"type": "li", "level": 0, "text": "Налоги — выберите налоги, которые будут применены к товару."}, {"type": "p", "text": "Следующие поля появляются, если на странице Настройки → Оформление заказа разрешено менять значение данной настройки на уровне отдельных объектов. Поле Отслеживать количество включается для отдельных объектов на странице Настройки → Общие."}, {"type": "li", "level": 0, "text": "Действие при нулевой цене — определяет, что можно сделать на витрине, если цена товара равна 0:"}, {"type": "li", "level": 1, "text": "Не разрешать добавлять товар в корзину"}, {"type": "li", "level": 1, "text": "Разрешить добавлять товар в корзину"}, {"type": "li", "level": 1, "text": "Попросить покупателя ввести цену — вместо цены будет отображено поле для ввода. Покупатель сможет предложить свою цену. Можно использовать для благотворительных акций и сборов."}, {"type": "li", "level": 0, "text": "Отслеживать количество — определяет, будет ли уменьшаться количество товара на складе после его покупки."}, {"type": "li", "level": 0, "text": "Минимальное количество для покупки одного продукта — минимальное количество экземпляров товара, которые пользователь может приобрести за 1 раз. Эта информация отображается на странице товара, сразу после цены."}, {"type": "li", "level": 0, "text": "Максимальное количество для покупки одного продукта — максимальное количество экземпляров товара, которые пользователь может приобрести за 1 раз. 0 означает отсутствие ограничений."}, {"type": "li", "level": 0, "text": "Шаг списка выбора количества — количество экземпляров товара, которые пользователь может добавить в корзину или убрать из неё за 1 раз.\nЕсли минимальный заказ равен 3, максимальный заказ равен 9, а шаг выбора равен 3, то покупатель сможет оформить заказ на 3, 6 или 9 товаров."}, {"type": "li", "level": 0, "text": "Доступное количество — ограничение на количество вариантов в выпадающем списке выбора количества товара. Это полезно, когда задан шаг выбора количества, а на складе очень много экземпляров товара."}, {"type": "h3", "text": "Доступность"}, {"type": "li", "level": 0, "text": "Группы пользователей — группы пользователей, для которых доступен этот товар."}, {"type": "li", "level": 0, "text": "Дата создания — дата, когда товар был добавлен в каталог. Используется в сортировке товаров по времени."}, {"type": "li", "level": 0, "text": "Доступен с — дата, с которой товар можно будет купить. Полезно, если товар ожидает поступления, или если вы хотите начать продажи в какой-то определённый день."}, {"type": "li", "level": 0, "text": "Действие при отсутствии товаров на складе — выберите, должна ли у покупателя быть возможность приобрести товар заранее или подписаться на уведомление по электронной почте о том, что товар доступен.\nПодробнее читайте в статье о действиях при отсутствии товара в наличии."}, {"type": "h3", "text": "Подробнее"}, {"type": "li", "level": 0, "text": "Отображение карточки товара — выберите шаблон (внешний вид) страницы товара. По умолчанию доступно 2 шаблона, но вы можете разработать свои собственные шаблоны под ваши нужды."}, {"type": "li", "level": 0, "text": "Следующие настройки появляются, если на странице Настройки → Общие → Каталог поставлена галочка Включить продажу цифровых товаров:"}, {"type": "li", "level": 1, "text": "Цифровой товар — если поставить галочку, то товар будет считаться цифровым."}, {"type": "li", "level": 1, "text": "Рассчитать стоимость доставки для электронного товара как для обычного — если поставить галочку, то стоимость доставки для этого цифрового товара будет рассчитываться, как для обычного."}, {"type": "li", "level": 1, "text": "Не ограниченная по времени загрузка — если поставить галочку, то период загрузки товара никогда не заканчивается.\nКак правило, купленный цифровой товар можно скачать в течение определенного времени. Это время задается в настройке Период доступности ключа для скачивания цифровых товаров в часах на странице Настройки → Общие."}, {"type": "li", "level": 0, "text": "Краткое описание — краткое описание товара; это описание появляется в списке товаров. Если оставить это поле пустым, то краткое описание создастся из полного автоматически (первые 300 символов)."}, {"type": "li", "level": 0, "text": "Популярность — целое число, которое обозначает популярность товара. Популярность вычисляется автоматически и зависит от того, сколько раз товар посмотрели на витрине, добавили в корзину и приобрели. На витрине товары можно сортировать по популярности."}, {"type": "li", "level": 0, "text": "Ключевые слова для поиска — список слов, по которым встроенный поиск в магазине должен находить этот товар."}, {"type": "li", "level": 0, "text": "Промо-текст — дополнительный блок с информацией; отображается в правом верхнем углу на странице товара."}, {"type": "h2", "text": "Опции"}, {"type": "p", "text": "На этой вкладке можно управлять опциями, их вариантами и комбинациями опций (в том числе запрещёнными и разрешёнными)."}, {"type": "images", "files": ["product-properties-01.png"]}, {"type": "p", "text": "Опции появляются на странице товара на витрине. В зависимости от типа опции, покупатели либо выбирают один из вариантов, либо вводят своё значение. Свойства опций описаны в отдельной статье."}, {"type": "h2", "text": "Вариации"}, {"type": "p", "text": "На этой вкладке вы можете создавать похожие товары и добавлять их в группу."}, {"type": "li", "level": 0, "text": "Добавить вариации — создайте вариации, автоматически на основе характеристик или с использованием существующих товаров."}, {"type": "li", "level": 0, "text": "Добавить в группу вариаций — добавьте этот товар как вариацию в существующую группу."}, {"type": "h2", "text": "Параметры доставки"}, {"type": "p", "text": "Свойства товара с этой вкладки используются при автоматическом расчёте стоимости доставки."}, {"type": "li", "level": 0, "text": "Вес — вес одного экземпляра товара в стандартной единице веса. Стандартная единица веса задаётся на странице Настройки → Общие."}, {"type": "li", "level": 0, "text": "Бесплатная доставка — если поставить галочку, то товар не будет учитываться при расчёте стоимости доставки, но только если у выбранного способа доставки стоит галочка Использовать для бесплатной доставки."}, {"type": "li", "level": 0, "text": "Стоимость доставки — дополнительный сбор (например, за страховку, упаковку и пр.), который будет прибавлена к общей стоимости доставки."}, {"type": "li", "level": 0, "text": "Количество штук в коробке — минимальное и максимальное значение, если товары доставляются по несколько штук в одной упаковке. Обычно подходит значение 1 - 1 (только один товар в коробке)."}, {"type": "li", "level": 0, "text": "Длина коробки — длина одной коробки."}, {"type": "li", "level": 0, "text": "Ширина коробки — ширина одной коробки."}, {"type": "li", "level": 0, "text": "Высота коробки — высота одной коробки."}, {"type": "p", "text": "Если вы не введёте информацию о размерах коробок здесь, то она будет браться из настроек способа доставки. Эта информация нужна для более точного расчёта стоимости доставки, когда способ доставки поддерживает отправку нескольких коробок (UPS, FedEx, DHL)."}, {"type": "h2", "text": "Оптовые скидки"}, {"type": "p", "text": "На этой вкладке задаются оптовые скидки на товар в зависимости от количества штук в корзине. Покупатели увидят эти скидки на странице товара на витрине."}, {"type": "link", "text": "На этой вкладке задаются оптовые скидки на товар в зависимости от количества штук в корзине. Покупатели увидят эти скидки на странице товара на витрине.", "url": "https://www.cs-cart.ru/docs/latest/user_guide/manage_products/products/wholesale.html"}, {"type": "images", "files": ["product-properties-02.png"]}, {"type": "p", "text": "У каждой оптовой скидки есть свой набор свойств:"}, {"type": "li", "level": 0, "text": "Кол-во — минимальное количество экземпляров товара, которое должно быть в корзине, чтобы покупатель получил оптовую скидку."}, {"type": "li", "level": 0, "text": "Значение — значение скидки (на каждый экземпляр товара)."}, {"type": "li", "level": 0, "text": "Тип — тип скидки:"}, {"type": "li", "level": 1, "text": "Фиксированная — стоимость одного товара со скидкой."}, {"type": "li", "level": 1, "text": "В процентах — размер скидки на каждый экземпляр товара в процентах."}, {"type": "li", "level": 0, "text": "Группа — группа пользователей, которая может воспользоваться скидкой.\nЕсли скидка действительна для всех групп пользователей и требует покупки только 1 экземпляра товара, эта скидка перезапишет цену товара."}, {"type": "link", "text": "Группа — группа пользователей, которая может воспользоваться скидкой.\nЕсли скидка действительна для всех групп пользователей и требует покупки только 1 экземпляра товара, эта скидка перезапишет цену товара.", "url": "https://www.cs-cart.ru/docs/latest/user_guide/users/user_groups/index.html"}, {"type": "images", "files": ["product-properties-03.png"]}, {"type": "h2", "text": "Продаваемые файлы"}, {"type": "p", "text": "Размещайте файлы и дистрибутивы для цифровых товаров. Эти файлы будут доступны покупателю после покупки товара."}, {"type": "p", "text": "Для цифровых инструкций и/или файлов, которые идут с товаром, но не продаются, рекомендуем использовать другую вкладку — Прикреплённые файлы."}, {"type": "images", "files": ["product-properties-04.png"]}, {"type": "p", "text": "У каждого файла есть следующие свойства:"}, {"type": "li", "level": 0, "text": "Название — название файла, которые покупатели увидят на странице товара. Это название не изменит физическое название самого файла."}, {"type": "li", "level": 0, "text": "Позиция — положение файла относительно других файлов в списке."}, {"type": "li", "level": 0, "text": "Папка — папка, к которой относится файл (если вы добавили папки)."}, {"type": "li", "level": 0, "text": "Файл — сам файл, который можно будет скачать после покупки."}, {"type": "li", "level": 0, "text": "Предпросмотр — файл предпросмотра, который можно свободно скачать на странице товара на витрине."}, {"type": "li", "level": 0, "text": "Режим активации — определяет, как будет активирована ссылка на скачивание:"}, {"type": "li", "level": 1, "text": "Немедленно — сразу после того, как покупатель сделает заказ."}, {"type": "li", "level": 1, "text": "После полной оплаты — после того, как статус заказа изменится на Обработан или Выполнен."}, {"type": "li", "level": 1, "text": "Вручную — ссылку активирует администратор вручную."}, {"type": "li", "level": 0, "text": "Макс. количество загрузок — определяет, сколько раз один и тот же покупатель может скачать файл."}, {"type": "li", "level": 0, "text": "Лицензионное соглашение — текст лицензионного соглашения."}, {"type": "li", "level": 0, "text": "Требуется соглашение — определяет, должен ли покупатель принять лицензионное соглашение на странице оформления заказа."}, {"type": "li", "level": 0, "text": "Текст для ознакомления — дополнительные инструкции (например, инструкции по установке и т.п.)"}, {"type": "h2", "text": "Подписчики"}, {"type": "p", "text": "Эта функциональность никак не связана со страницей Маркетинг → Рассылки → Подписчики, которая добавляется модулем “Рассылки”."}, {"type": "p", "text": "Если товара нет в наличии, покупатели могут подписаться на уведомление. Когда вы обновите количество товаров на складе, подписчики получат электронное письмо об этом."}, {"type": "p", "text": "У каждого товара есть свой список с электронными адресами подписчиков. Этот список и находится на вкладке Подписчики. Когда товар снова появляется в наличии, электронные письма отправляются подписчикам, а их электронные адреса удаляются из списка."}, {"type": "p", "text": "Процесс полностью автоматизирован. Однако вы можете добавить подписчика вручную, если это необходимо."}, {"type": "p", "text": "Подробнее о подписчиках можно узнать в этой статье."}, {"type": "h2", "text": "Модули"}, {"type": "p", "text": "Вкладка Модули содержит свойства товаров которые добавлены с помощью дополнительных модулей. Например:"}, {"type": "h3", "text": "Возврат товаров"}, {"type": "p", "text": "Эти свойства относятся к модулю “Возврат товаров”."}, {"type": "li", "level": 0, "text": "Возможен возврат — если поставить галочку, то товар можно будет вернуть в магазин."}, {"type": "li", "level": 0, "text": "Время возврата (в днях) — время, в течение которого товар можно вернуть. Отсчёт начинается в день покупки."}, {"type": "h3", "text": "Хиты продаж"}, {"type": "p", "text": "Эти свойства относятся к модулю “Хиты продаж и товары со скидкой”."}, {"type": "li", "level": 0, "text": "Количество продаж — сколько экземпляров товара было продано. Рассчитывается автоматически, когда включен модуль Хиты продаж и товары со скидкой. Это значение можно изменить вручную."}, {"type": "h3", "text": "Проверка возраста"}, {"type": "p", "text": "Эти свойства относятся к модулю “Ограничение по возрасту”."}, {"type": "li", "level": 0, "text": "Проверка возраста — если поставить галочку, то товар смогут увидеть только пользователи определённого возраста."}, {"type": "li", "level": 0, "text": "Возрастное ограничение — минимальный возраст для просмотра этого товара."}, {"type": "li", "level": 0, "text": "Предупреждение — сообщение, которое увидит покупатель, если он не может просмотреть товар из-за своего возраста."}, {"type": "h3", "text": "Комментарии и отзывы"}, {"type": "p", "text": "Эти свойства относятся к модулю Отзывы и комментарии."}, {"type": "li", "level": 0, "text": "Отзывы — выберите, разрешить ли пользователям оставлять оценки и/или комментарии к товару."}, {"type": "h2", "text": "Характеристики"}, {"type": "p", "text": "На этой вкладке можно задать значения дополнительных полей, которые относятся к товару. Эти дополнительные поля создаются на странице Товары → Характеристики."}, {"type": "h2", "text": "Вкладки товара"}, {"type": "p", "text": "На этой вкладке находится список вкладок, которые будут отображаться на странице этого товара. Рядом с каждой вкладкой есть статус — Вкл. или Выкл. Добавлять и редактировать вкладки можно на странице Дизайн → Вкладки товара."}, {"type": "p", "text": "Чтобы увидеть, как выглядит страница товара, нажимте на кнопку с изображением шестерёнки и выберите вариант Предпросмотр."}, {"type": "h2", "text": "Комбинации товаров"}, {"type": "p", "text": "Эта вкладка появляется, если включен модуль “Комбинации товаров”."}, {"type": "link", "text": "Эта вкладка появляется, если включен модуль “Комбинации товаров”.", "url": "https://www.cs-cart.ru/docs/latest/user_guide/addons/buy_together/index.html"}, {"type": "p", "text": "На этой вкладке можно связывать товары из каталога друг с другом и предлагать скидку, если товары покупаются вместе. Такая связка называется комбинацией товаров. Информация о скидке появляется на странице товара на витрине, а покупатели решают, воспользоваться ли предложением."}, {"type": "p", "text": "Помимо самих товаров и размера скидки, у комбинации товаров есть следующие свойства:"}, {"type": "li", "level": 0, "text": "Название — название комбинации товаров."}, {"type": "li", "level": 0, "text": "Описание — описание комбинации товаров, которое появится на витрине."}, {"type": "li", "level": 0, "text": "Задать период доступности — если поставить галочку, то можно настроить:"}, {"type": "li", "level": 1, "text": "Доступна с — дата, с которой комбинация товаров доступна для покупателей."}, {"type": "li", "level": 1, "text": "Доступна до — дата, до которой комбинация товаров доступна для покупателей."}, {"type": "li", "level": 0, "text": "Показывать в промо-акциях — если поставить галочку, эта комбинация товаров появится в списке промо-акций (index.php?dispatch=promotions.list)."}, {"type": "li", "level": 0, "text": "Статус — статус комбинации товаров (Вкл. или Выкл.)."}, {"type": "h2", "text": "Теги"}, {"type": "p", "text": "Эта вкладка появляется, если включен модуль “Теги”."}, {"type": "p", "text": "На этой вкладке находится список тегов, связанный с товаром. Теги появляются на витрине в блоке Теги."}, {"type": "li", "level": 0, "text": "Теги — список тегов товара. Когда вы начинаете печатать название тега, CS-Cart автоматически предлагает возможные варианты из существующих тегов."}, {"type": "images", "files": ["product-properties-05.png"]}, {"type": "h2", "text": "Прикреплённые файлы"}, {"type": "p", "text": "Эта вкладка появляется, если включен модуль “Прикреплённые файлы”."}, {"type": "p", "text": "На этой вкладке находятся файлы, связанные с товаром. В отличие от “Продаваемых файлов”, эта вкладка доступна не только для цифровых товаров. У каждого прикреплённого файла есть следующие свойства:"}, {"type": "li", "level": 0, "text": "Название — название прикреплённого файла."}, {"type": "li", "level": 0, "text": "Позиция — положение прикреплённого файла в списке относительно положения других файлов."}, {"type": "li", "level": 0, "text": "Файл — сам файл, который нужно загрузить."}, {"type": "li", "level": 0, "text": "Группы пользователей — группы пользователей, которым доступен файл."}, {"type": "h2", "text": "Бонусные баллы"}, {"type": "p", "text": "Эта вкладка появляется, если включен модуль “Бонусные баллы”."}, {"type": "p", "text": "На этой вкладке задается цена товара в бонусных баллах и количество баллов, получаемых за покупку товара."}, {"type": "h3", "text": "Цена в баллах"}, {"type": "li", "level": 0, "text": "Разрешить оплату баллами — если поставить галочку, покупатель сможет оплатить этот товар баллами."}, {"type": "li", "level": 0, "text": "Заменить глобальный курс конвертации баллов — если поставить галочку, то у товара будет фиксированная цена в баллах; эта цена не будет зависеть от курса конвертации баллов."}, {"type": "li", "level": 0, "text": "Цена в баллах — жёстко заданная цена товара в баллах."}, {"type": "h3", "text": "Баллы за товар"}, {"type": "li", "level": 0, "text": "Заменить глобальные баллы и баллы категории для этого товара — если поставить галочку, то значения ниже перезапишут для этого товара настройки, которые задаются на странице Маркетинг → Бонусные баллы."}, {"type": "li", "level": 0, "text": "Группа — группы пользователей, которые получают бонусные баллы за покупку товара."}, {"type": "li", "level": 0, "text": "Сумма — количество бонусных баллов, которые получают пользователи за покупку товара."}, {"type": "li", "level": 0, "text": "Тип количества — либо абсолютное значение, либо процент от стоимости."}, {"type": "h2", "text": "Отзывы"}, {"type": "p", "text": "Эта вкладка появляется, если включен модуль “Отзывы и комментарии”, а для товара включены отзывы или комментарии на вкладке Модули."}, {"type": "p", "text": "Список отзывов покупателей о товаре. Здесь можно добавлять отзывы или редактировать существующие."}, {"type": "h2", "text": "Обязательные товары"}, {"type": "p", "text": "Эта вкладка появляется, если включен модуль “Требуемые товары”."}, {"type": "p", "text": "На этой вкладке находится список товаров, которые обязательно будут добавлены в корзину вместе с этим товаром. Нажмите кнопку Добавить товары, чтобы выбрать обязательные товары."}, {"type": "images", "files": ["product-properties-06.png"]}, {"type": "h2", "text": "Макеты"}, {"type": "p", "text": "Содержимое детальной страницы товара. Эта вкладка дублирует общий макет страницы товара."}, {"type": "p", "text": "Здесь вы можете отключить или включить блоки, изменяя таким образом страницу товара. Любое изменение, сделанное здесь, не затронет страницы других товаров."}]}, {"id": "product-variations", "title": "Вариации товаров", "blocks": [{"type": "p", "text": "Вариации товаров являются частью одноимённого модуля."}, {"type": "p", "text": "Вариации — это похожие товары, которые отличаются друг от друга одной или несколькими характеристиками. Например, “зелёная футболка “Спорт” размера S” и “красная футболка “Спорт” размера M”. Таким товарам нужно три вещи:"}, {"type": "li", "level": 0, "text": "Дать покупателям выбрать нужные значения характеристик на странице товара."}, {"type": "li", "level": 0, "text": "Показать часть вариаций (например, разные цвета) как отдельные позиции в каталоге. Так покупатель ещё до страницы товара увидит нужный цвет."}, {"type": "li", "level": 0, "text": "Не показывать часть вариаций (например, размеры) как отдельные позиции в каталоге. Так покупатель не запутается среди множества товара с разными размерами и одинаковой картинкой."}, {"type": "p", "text": "в приложении                                    на сайте"}, {"type": "images", "files": ["product-variations-01.jpg", "product-variations-02.png"]}, {"type": "h2", "text": "Терминология"}, {"type": "p", "text": "Группа вариаций — группа похожих товаров, которые отличаются друг от друга одной или несколькими характеристиками."}, {"type": "p", "text": "Вариация — товар, который относится к группе вариаций. Одновременно товар может относиться только к одной группе вариаций, но заменить группу у товара легко. Если вариацию отцепить от группы вариаций, она станет обычным товаром."}, {"type": "p", "text": "Позиция в каталоге — одно место на списке товаров. Пока не было вариаций, то “товар” и “позиция в каталоге” означали одно и то же. Но вариации могут и не занимать позицию в каталоге, поэтому возникла необходимость в таком термине."}, {"type": "p", "text": "Каждая вариация — это товар, но не каждый товар — вариация. Используйте Расширенный поиск на списке товаров в панели администратора: например там можно сделать так, чтобы на списке товаров были только вариации или только позиции в каталоге."}, {"type": "p", "text": "У футболки 3 цвета, по 5 размеров в каждом. В этом случае у нас 15 товаров. Мы хотим добавить переключение между ними и объединяем их в группу вариаций на основе характеристик “Цвет” и “Размер”. Теперь у нас 15 вариаций, и между всеми ними можно переключаться на их страницах."}, {"type": "p", "text": "В зависимости от настроек характеристик, эти 15 вариаций могут занимать:"}, {"type": "li", "level": 0, "text": "1 позицию в каталоге — выбор цветов и размеров остаётся только на странице товара;"}, {"type": "li", "level": 0, "text": "3 позиции в каталоге — футболки разных цветов отображаются на витрине как отдельные товары, а вот размеры можно выбрать только на странице товара;"}, {"type": "li", "level": 0, "text": "5 позиций в каталоге — если кто-то решит отображать размеры как отдельные товары, а выбор цвета оставить только на странице товара; с футболками такое неактуально, но может подойти для других товаров."}, {"type": "li", "level": 0, "text": "15 позиций в каталоге — когда каждый размер и цвет отображается как отдельный товар, т.е. каждой вариации соответствует своя позиция в каталоге.\nЭта схема работает, даже когда характеристик больше двух. Настройки характеристик можно поменять в любой момент, но количество занимаемых позиций изменится только после того, как вы распустите и пересоздадите группу вариаций. Подробности ниже."}, {"type": "h2", "text": "Работа с вариациями"}, {"type": "h2", "text": "Создание новой группы вариаций"}, {"type": "p", "text": "Предположим, вы добавили в свой магазин новый товар и хотите создать для него вариации. Сделать это можно прямо со страницы товара:"}, {"type": "li", "level": 0, "text": "На странице товара откройте вкладку Вариации."}, {"type": "li", "level": 0, "text": "Нажмите кнопку Добавить вариации."}, {"type": "li", "level": 0, "text": "На вкладке Создать новые товары введите название характеристики. Если такая характеристика в вашем магазине уже существует, то она будет предложена.\nВ предложенных характеристиках отображаются далеко не все характеристики. Это зависит от того, какая Цель была указана в их настройках.\nЕсли ее еще не существует в магазине, нажмите кнопку Добавить и задайте одну из двух Целей для новой характеристики. От выбранной цели зависит, займут ли вариации с разными значениями этой характеристики отдельные позиции в каталоге."}, {"type": "li", "level": 0, "text": "Добавьте Варианты для ваших характеристик."}, {"type": "li", "level": 0, "text": "Нажмите кнопку Создать. Вариации сгенерируются автоматически."}, {"type": "images", "files": ["product-variations-03.png"]}, {"type": "h2", "text": "Если вы хотите поменять названия для созданной вариации к примеру “Футболка синяя Латекс” на “Футболка Латекс” так как при создании у всех товаров названия меняется на названия товара с которым связываете."}, {"type": "p", "text": "В настроке товара в 1с, в строке “Не обновлять наименование” проставьте галочку, чтоб при обмене товара названия на сменился."}, {"type": "images", "files": ["product-variations-04.png"]}, {"type": "h2", "text": "Объединение товаров в группу вариаций"}, {"type": "p", "text": "Допустим, вы импортировали товары поставщика в свой магазин и хотите объединить какие-то товары в одну группу. Это позволит вашим покупателям выбирать их, просто переключаясь между вариациями, а не путаться в аналогичных товарах с разными вариантами характеристик. Для этого необходимо сделать следующее:"}, {"type": "li", "level": 0, "text": "Зайдите на страницу одного из товаров и откройте вкладку Вариации."}, {"type": "li", "level": 0, "text": "Нажмите кнопку Добавить вариации."}, {"type": "li", "level": 0, "text": "Перейдите на вкладку Использовать существующие товары. На ней отобразятся аналогичные товары с такими же характеристиками.\nВ списке отобразятся товары, которые соответствуют трем условиям:"}, {"type": "li", "level": 1, "text": "из той же категории;"}, {"type": "li", "level": 1, "text": "с теми же характеристиками, но в других вариантах;"}, {"type": "li", "level": 1, "text": "с Целями характеристик, позволяющими создавать вариации."}, {"type": "li", "level": 0, "text": "Выделите нужные товары и нажмите кнопку Добавить вариации."}, {"type": "images", "files": ["product-variations-05.png"]}, {"type": "h2", "text": "Управление и удаление"}, {"type": "p", "text": "Когда группа вариаций создана, то все товары из неё отображаются на вкладке Вариации у любого товара в группе. Здесь вы можете:"}, {"type": "li", "level": 0, "text": "увидеть, какие из вариаций занимают позицию в каталоге, а какие — нет. У вариаций без своей позиции в каталоге картинка меньше;"}, {"type": "li", "level": 0, "text": "указать, какую из нескольких вариаций делать выбранной по умолчанию для позиции в каталоге;\nОстальные вариации будут заимствовать многие свои свойства у вариации, выбранной по умолчанию."}, {"type": "li", "level": 0, "text": "убрать вариацию из группы; товар при этом не пропадёт, а станет самостоятельным;"}, {"type": "li", "level": 0, "text": "удалить вариацию насовсем;"}, {"type": "li", "level": 0, "text": "поменять код группы — его можно использовать, чтобы потом добавлять другие товары в эту группу как вариации. Код группы может содержать только цифры, латиницу и знаки “-” и “_”;"}, {"type": "li", "level": 0, "text": "добавить ещё вариаций в группу;"}, {"type": "li", "level": 0, "text": "переключиться на редактирование вариаций на списке товаров — так можно получить доступ к массовому редактированию и удалению;"}, {"type": "li", "level": 0, "text": "распустить группу — тогда все вариации из неё станут самостоятельными товарами, и пропадёт возможность переключаться между ними со страницы товара."}, {"type": "images", "files": ["product-variations-06.png"]}]}]}]};
const home=document.getElementById('home'),sectionPage=document.getElementById('sectionPage'),articlePage=document.getElementById('articlePage'),cards=document.getElementById('cards'),nav=document.getElementById('nav');
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function showPage(el){[home,sectionPage,articlePage].forEach(x=>x.classList.remove('active'));el.classList.add('active')}
function activeNav(id){document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.route===id))}
function build(){
 DATA.sections.forEach(sec=>{
   const b=document.createElement('button');b.className='nav-btn';b.dataset.route=sec.id;b.innerHTML=`<span class="nav-ico">${sec.icon}</span>${esc(sec.title)}`;b.onclick=()=>location.hash=`#section/${sec.id}`;nav.appendChild(b);
   const c=document.createElement('div');c.className='card';c.innerHTML=`<div class="card-top"><div class="card-icon">${sec.icon}</div><div><h3>${esc(sec.title)}</h3><p>${esc(sec.description)}</p></div></div><div class="card-meta">${sec.articles.length} инструкций</div>`;c.onclick=()=>location.hash=`#section/${sec.id}`;cards.appendChild(c);
 });
}
function findSec(id){return DATA.sections.find(s=>s.id===id)}
function showSection(id){
 const sec=findSec(id);if(!sec)return showHome();showPage(sectionPage);activeNav(sec.id);
 sectionPage.innerHTML=`<button class="back" onclick="location.hash='#home'">← Главная</button><div class="section-banner"><div class="kicker">Раздел документации</div><h1>${esc(sec.title)}</h1><p>${esc(sec.description)}</p></div><div class="article-list">${sec.articles.map(a=>`<div class="article-row" onclick="openArticle('${sec.id}','${a.id}')"><div class="doc-icon">▤</div><div>${esc(a.title)}</div><div class="arrow">${a.external?'↗':'→'}</div></div>`).join('')}</div>`;
}
function openArticle(secId,articleId){
 const sec=findSec(secId),a=sec&&sec.articles.find(x=>x.id===articleId);if(!a)return;
 if(a.external){window.open(a.external,'_blank');return}
 location.hash=`#article/${secId}/${articleId}`;
}
function renderBlocks(blocks){
 let out='',inSteps=false;
 const closeSteps=()=>{if(inSteps){out+='</div>';inSteps=false}};
 blocks.forEach((b,i)=>{
   if(b.type==='li'){
     if(!inSteps){out+='<div class="steps">';inSteps=true}
     out+=`<div class="li level${b.level||0}">${esc(b.text)}</div>`;return;
   }
   closeSteps();
   if(b.type==='h2')out+=`<h2 id="h${i}">${esc(b.text)}</h2>`;
   else if(b.type==='h3')out+=`<h3 id="h${i}">${esc(b.text)}</h3>`;
   else if(b.type==='p')out+=`<p>${esc(b.text).replace(/\n/g,'<br>')}</p>`;
   else if(b.type==='link')out+=`<a class="video-link" href="${esc(b.url)}" target="_blank" rel="noopener">▶ ${esc(b.text)}</a>`;
   else if(b.type==='images'){out+=`<div class="shots ${b.files.length===2?'two':''}">${b.files.map(f=>`<div class="shot" onclick="openImg('images/${f}')"><img src="images/${f}" alt=""></div>`).join('')}</div>`}
 });
 closeSteps();return out;
}
function showArticle(secId,articleId){
 const sec=findSec(secId),a=sec&&sec.articles.find(x=>x.id===articleId);if(!a)return showHome();
 showPage(articlePage);activeNav(sec.id);
 const headings=(a.blocks||[]).map((b,i)=>({b,i})).filter(x=>x.b.type==='h2'||x.b.type==='h3').slice(0,12);
 articlePage.innerHTML=`<button class="back" onclick="location.hash='#section/${sec.id}'">← ${esc(sec.title)}</button><div class="article-layout"><article class="article"><div class="crumbs">База знаний / ${esc(sec.title)}</div><h1>${esc(a.title)}</h1>${renderBlocks(a.blocks||[])}</article><aside class="toc"><strong>На этой странице</strong>${headings.length?headings.map(x=>`<a href="#h${x.i}">${esc(x.b.text)}</a>`).join(''):'<a>Инструкция</a>'}</aside></div>`;
}
function showHome(){showPage(home);activeNav('home')}
function route(){
 const h=location.hash||'#home',p=h.split('/');
 if(h.startsWith('#section/'))showSection(p[1]);else if(h.startsWith('#article/'))showArticle(p[1],p[2]);else showHome();
 window.scrollTo({top:0,behavior:'instant'});
}
function openImg(src){document.getElementById('overlayImg').src=src;document.getElementById('overlay').classList.add('open')}
function closeImg(){document.getElementById('overlay').classList.remove('open')}
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeImg()});
const search=document.getElementById('search'),results=document.getElementById('results');
search.addEventListener('input',()=>{
 const q=search.value.trim().toLowerCase();if(!q){results.style.display='none';return}
 let found=[];DATA.sections.forEach(sec=>sec.articles.forEach(a=>{if(a.title.toLowerCase().includes(q)||sec.title.toLowerCase().includes(q))found.push({sec,a})}));
 results.innerHTML=found.slice(0,12).map(x=>`<div class="result" onclick="openArticle('${x.sec.id}','${x.a.id}');results.style.display='none'"><b>${esc(x.a.title)}</b><small>${esc(x.sec.title)}</small></div>`).join('')||'<div class="result"><small>Ничего не найдено</small></div>';results.style.display='block';
});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))results.style.display='none'});
build();window.addEventListener('hashchange',route);route();
</script>
</body></html>
